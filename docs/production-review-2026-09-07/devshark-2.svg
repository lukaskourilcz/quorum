<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Quiz question and answers 1</title><desc id="desc">Original devShark carousel layout rendered by the Design Lab.</desc><rect width="1080" height="1350" fill="#0b141b"/><g transform="translate(86.4,202.7484) scale(2.43)" fill="#60a5fa"><path d="M3 18 Q6 6 15 3 Q17 11 21 18 Z"/><path d="M15 3 Q17 11 21 18 L16 18 Q14 10 15 3 Z" fill="black" opacity="0.12"/></g><text x="165.132" y="254.07" fill="#60a5fa" font-family="Figtree ExtraBold" font-size="58.32" font-weight="800" letter-spacing="1.75">DEVSHARK</text><text x="86.4" y="364.5" text-anchor="start" fill="#e8eef0" font-family="Figtree ExtraBold" font-size="54" font-weight="800"><tspan x="86.4" dy="0">When does cleanup run?</tspan></text><text x="108" y="609" text-anchor="start" fill="#e8eef0" font-family="Public Sans" font-size="42" font-weight="700"><tspan x="108" dy="0">A. only on mount</tspan></text><text x="108" y="764.25" text-anchor="start" fill="#e8eef0" font-family="Public Sans" font-size="42" font-weight="700"><tspan x="108" dy="0">B. before the next effect run and on</tspan><tspan x="108" dy="47.040000000000006">unmount</tspan></text><text x="108" y="919.5" text-anchor="start" fill="#e8eef0" font-family="Public Sans" font-size="42" font-weight="700"><tspan x="108" dy="0">C. only on unmount</tspan></text><text x="108" y="1074.75" text-anchor="start" fill="#e8eef0" font-family="Public Sans" font-size="42" font-weight="700"><tspan x="108" dy="0">D. never</tspan></text></svg>