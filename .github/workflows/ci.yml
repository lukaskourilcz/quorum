name: CI

on:
  # The council pushes about eighteen commits a day and every one of them started a full CI run —
  # agents:validate, lint, typecheck, the whole suite, a production build and a route smoke — on
  # content the cycle's own post-cycle gate had just run the same five commands against, in the
  # same job, minutes earlier. That is roughly eighty minutes of runner time a day spent asking a
  # question that was already answered.
  #
  # These paths are what a cycle writes. A push that touches only them is covered by the gate that
  # produced it. Anything else — source, workflows, config, contracts — still runs the full CI, and
  # pull requests are never filtered, so a human change is verified exactly as before.
  # Prose is the second class of push that starts a full CI run and can only ever confirm what it
  # confirmed last time. Two directories that look like prose are deliberately NOT here.
  # `orchestrator/prompts/**` is read into a live room, so changing one changes what the company
  # does. `.claude/skills/**` and `.agents/skills/**` are mirrored byte-for-byte and
  # `architecture.test.ts` compares them file by file — editing one tree without the other is
  # exactly the mistake that filter would hide, and there are nineteen mirrored skills now.
  push:
    paths-ignore:
      - "state/**"
      - "docs/**"
      - "*.md"
      - "NEEDS_YOUR_HELP_NOW.md"
      - "NEEDED.md"
      - "site/public/social/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate agent identity assets
        run: pnpm agents:validate

      - name: Lint
        run: pnpm lint

      # Its own step rather than a line inside `pnpm lint`: the hook lint reports per-rule findings
      # and a run's warnings (the geo variants their gate makes unreachable) are meant to be read,
      # not folded into an eslint summary.
      - name: Lint hook libraries
        run: pnpm lint:hooks

      # The conformance vectors are generated from the evaluator, so a stale file pins nothing.
      - name: Check hook conformance vectors
        run: pnpm hooks:vectors -- --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Production route and link smoke
        run: |
          pnpm --filter @boardlessai/site start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm site:smoke
