name: Report crons to OwnDashboard

# Fires after each scheduled workflow finishes and reports its outcome to the
# OwnDashboard cron log (Home → Crons panel). No-ops unless the two secrets are
# set, so it is safe to merge before configuring them.
on:
  workflow_run:
    workflows:
      - "Guarded council cycle"
      - "Production health"
      - "Guarded social publisher"
    types: [completed]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report run to OwnDashboard
        env:
          URL: ${{ secrets.OWNDASHBOARD_CRON_URL }}
          TOKEN: ${{ secrets.OWNDASHBOARD_CRON_TOKEN }}
          NAME: ${{ github.event.workflow_run.name }}
          WFPATH: ${{ github.event.workflow_run.path }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "OwnDashboard cron reporting not configured; skipping."
            exit 0
          fi
          status="failure"
          [ "$CONCLUSION" = "success" ] && status="success"
          payload=$(printf '{"name":"%s","endpoint":"%s","status":"%s","source":"github_actions"}' \
            "$NAME" "$WFPATH" "$status")
          curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "OwnDashboard report failed (non-fatal)"
