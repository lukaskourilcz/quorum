name: Guarded council cycle

on:
  schedule:
    - cron: "55 1 * * *"
    - cron: "55 2 * * *"
    - cron: "55 3 * * *"
    - cron: "55 4 * * *"
    - cron: "55 5 * * *"
    - cron: "55 6 * * *"
    - cron: "55 7 * * *"
    - cron: "55 8 * * *"
    - cron: "55 9 * * *"
    - cron: "55 10 * * *"
    - cron: "55 11 * * *"
    - cron: "55 13 * * *"
    - cron: "55 14 * * *"
    - cron: "55 15 * * *"
    - cron: "55 16 * * *"
    - cron: "55 17 * * *"
    - cron: "55 18 * * *"
    - cron: "55 19 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Council phase
        required: true
        default: morning
        type: choice
        options:
          - cu-edition
          - morning
          - afternoon
          - cu-product
          - tt-marketing
          - incubator-scan
          - incubator-synthesis
          - mma-intake
          - mag-editorial
          - article-am
          - mma-analysis
          - mag-desk
          - studio
          - night
      trigger:
        # What kind of firing this dispatch is, which decides whether it claims a slot.
        #
        # GitHub's `schedule` trigger is best effort and has been badly late: 13 to 54 minutes on
        # 2 August, 2h23m to 2h55m on 4 August. `workflow_dispatch` starts within seconds, so the
        # punctual path is a Vercel cron calling the GitHub API on the slot's own hour. Such a
        # dispatch is a scheduled meeting in every way that matters — it must run live, it owns
        # the slot, and it owes the calendar a record or a stated reason — so `vercel-cron` makes
        # every gate below treat it exactly as a cron firing would be treated. `manual` is the
        # owner at the keyboard: it claims no slot and keeps the dry run it asked for.
        description: Which schedule this dispatch came from
        required: false
        default: manual
        type: choice
        options:
          - manual
          - vercel-cron
      dry:
        description: Never call paid APIs or write canonical state
        required: true
        default: true
        type: boolean
      delivery_only:
        description: Deliver pending content for the selected Caught Up or MMA phase without paid model calls
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: guarded-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycle:
    name: Run bounded council cycle
    if: ${{ vars.AUTONOMY_KILL_SWITCH != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      # The live switches must reach the cycle itself, not only the step that decides
      # whether to skip. They were declared on "Resolve guarded cycle mode" alone, so a
      # dispatched mma-intake passed the skip check and then paused itself:
      # portfolio/run.ts:467 reads process.env.PORTFOLIO_LIVE_ENABLED, saw undefined and
      # returned status "paused" with zero agents. cycle.ts:847 re-checks the MMA switch the
      # same way. That silently blocked every portfolio phase — tt-marketing, both incubator
      # rooms, mma-intake, mma-analysis, mag-editorial, mag-desk and studio.
      CAUGHT_UP_LIVE_ENABLED: ${{ vars.CAUGHT_UP_LIVE_ENABLED }}
      PORTFOLIO_LIVE_ENABLED: ${{ vars.PORTFOLIO_LIVE_ENABLED }}
      FIGHTAIQ_LIVE_ENABLED: ${{ vars.FIGHTAIQ_LIVE_ENABLED }}
      FIGHTAIQ_ANALYSIS_ENABLED: ${{ vars.FIGHTAIQ_ANALYSIS_ENABLED }}
      MMA_FILES_LIVE_ENABLED: ${{ vars.MMA_FILES_LIVE_ENABLED }}
      # TEMPORARY, 2026-08-04 to 2026-08-09. The owner doubled the four caps below because
      # testing, not production work, was consuming them, and a cap hit was stopping articles
      # from shipping. On 2026-08-04 the edition run billed three calls for about $0.25 and
      # delivered no edition: rewrite_1's article failed the quality gate on
      # maximum_repeated_topic_frequency, and rewrite_2 — the attempt that would have replaced
      # it — could not start, "Edition call reserve 0.138261 would exceed 0.35", in
      # state/edition/runs/2026-08-04-18f2f821b302*.json. What the raise buys is more attempts
      # at an article that passes the gate. It moves no quality threshold, and nothing here
      # lets a rejected article ship.
      #
      # The 2026-08-04 doubling is reverted. Three of the four caps go back to the values they
      # named; the edition per-run cap does not, and settles at $0.50 rather than $0.35.
      #
      # $0.35 no longer fits the pipeline it is capping. Fetching source bodies made write and
      # rewrite calls $0.10-0.12 each, so curate + write + the two configured rewrites is
      # $0.38-0.45 -- above the old cap before the first rewrite starts. Reserve refusals were
      # the single most frequent edition-killer on 1, 2 and 4 August: the call the config
      # promises could not be afforded, and the day shipped nothing. $0.50 buys the promised
      # second rewrite and nothing else.
      #
      # The two monthly ceilings do not move, here or anywhere: MONTHLY_BUDGET_USD is the $25
      # model/API share and MONTHLY_OPERATING_CAP_USD the $30 all-in cap, both from
      # budget-2026-08e. A per-run cap lets one run try harder; it buys no extra month.
      MONTHLY_OPERATING_CAP_USD: "30"
      MAX_CYCLE_BUDGET_USD: "0.20"
      CU_MEETING_BUDGET_USD: "0.08"
      EDITION_PRODUCTION_BUDGET_USD: "0.50"
      DAILY_BUDGET_USD: "1.00"
      MONTHLY_BUDGET_USD: "25"
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      CAUGHT_UP_SITE_URL: ${{ vars.CAUGHT_UP_SITE_URL }}
      MMA_FILES_SITE_URL: ${{ vars.MMA_FILES_SITE_URL }}
      MMA_FILES_INDEXING_ENABLED: ${{ vars.MMA_FILES_INDEXING_ENABLED }}
      DAILY_DIGEST_EMAIL_MODE: ${{ vars.DAILY_DIGEST_EMAIL_MODE }}
      DAILY_DIGEST_EMAIL_FROM: ${{ vars.DAILY_DIGEST_EMAIL_FROM }}
      DAILY_DIGEST_EMAIL_TO: ${{ secrets.DAILY_DIGEST_EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FREE_TIER_MONTHLY: ${{ vars.RESEND_FREE_TIER_MONTHLY }}
      RESEND_FREE_TIER_DAILY: ${{ vars.RESEND_FREE_TIER_DAILY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Honor repository kill switch
        run: |
          if test -e state/PAUSED; then
            echo "state/PAUSED is present; refusing to run."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve guarded cycle mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_DRY: ${{ inputs.dry }}
          INPUT_TRIGGER: ${{ inputs.trigger }}
          INPUT_DELIVERY_ONLY: ${{ inputs.delivery_only }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_DELIVERY_APP_ID: ${{ secrets.DELIVERY_APP_ID != '' }}
          HAS_DELIVERY_APP_KEY: ${{ secrets.DELIVERY_APP_PRIVATE_KEY != '' }}
          CAUGHT_UP_LIVE_ENABLED: ${{ vars.CAUGHT_UP_LIVE_ENABLED }}
          PORTFOLIO_LIVE_ENABLED: ${{ vars.PORTFOLIO_LIVE_ENABLED }}
          FIGHTAIQ_LIVE_ENABLED: ${{ vars.FIGHTAIQ_LIVE_ENABLED }}
          FIGHTAIQ_ANALYSIS_ENABLED: ${{ vars.FIGHTAIQ_ANALYSIS_ENABLED }}
          MMA_FILES_LIVE_ENABLED: ${{ vars.MMA_FILES_LIVE_ENABLED }}
        run: |
          phase="${INPUT_PHASE:-morning}"
          dry="${INPUT_DRY:-true}"
          skip_reason=""
          duplicate=false
          delivery_only="${INPUT_DELIVERY_ONLY:-false}"
          firing_outcome="meeting"
          firing_slot=""
          firing_reason=""
          # Whether this run claims a meeting slot, which is a different question from which
          # GitHub event carried it. A cron firing claims one. So does the Vercel cron, which
          # reaches this workflow as a dispatch because that is the only trigger that starts
          # within seconds. Everything below that decides live mode, records a skip or owes the
          # calendar an explanation keys on this, not on the event name; only the two lines that
          # read github.event.schedule stay on the event, because a dispatch carries no cron.
          scheduled=false
          if test "$EVENT_NAME" = "schedule" || test "$INPUT_TRIGGER" = "vercel-cron"; then
            scheduled=true
            dry=false
          fi
          if test "$EVENT_NAME" = "schedule"; then
            # --json, because "skip" alone cannot say which kind of skip it is, and the two need
            # opposite handling. An inactive daylight-saving cron has no meeting behind it and
            # must leave nothing behind either. A cron GitHub delivered past the six-hour window
            # does have one, and it is owed a stated reason: without it the slot goes red with
            # nothing anywhere explaining it, which is the state this whole recorder chain exists
            # to prevent. The worst delivery seen is 3h20m, on 3 August, against that window.
            firing="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts --scheduled --cron "$EVENT_SCHEDULE" --json)"
            phase="$(printf '%s' "$firing" | jq -r '.phase')"
            firing_outcome="$(printf '%s' "$firing" | jq -r '.outcome')"
            firing_slot="$(printf '%s' "$firing" | jq -r '.slot // ""')"
            firing_reason="$(printf '%s' "$firing" | jq -r '.reason // ""')"
          else
            phase="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts --phase "$phase")"
          fi
          skip=false
          if test "$phase" = "skip"; then
            skip=true
            dry=true
            if test "$firing_outcome" = "beyond-window"; then
              # The slot is named from the cron even though no room can be opened for it, so the
              # recorder below has a phase to file the skip under.
              phase="$firing_slot"
              skip_reason="$firing_reason"
            else
              skip_reason="The inactive DST cron variant has no Prague wall-clock meeting."
            fi
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && { test "$phase" = "tt-marketing" || test "$phase" = "incubator-scan" || test "$phase" = "incubator-synthesis" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "mag-editorial" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk" || test "$phase" = "studio"; }; then
            if test "$PORTFOLIO_LIVE_ENABLED" != "true"; then
              skip=true
              skip_reason="Portfolio meeting crons await explicit owner approval."
              echo "$skip_reason"
            else
              schedule_json="$(pnpm --filter @boardlessai/orchestrator exec tsx src/portfolio/schedule-cli.ts --phase "$phase")"
              enabled="$(printf '%s' "$schedule_json" | jq -r '.enabled')"
              monthly_budget="$(printf '%s' "$schedule_json" | jq -r '.monthlyBudgetUsd')"
              daily_budget="$(printf '%s' "$schedule_json" | jq -r '.dailyBudgetUsd')"
              monthly_operating="$(printf '%s' "$schedule_json" | jq -r '.monthlyOperatingUsd')"
              echo "MONTHLY_BUDGET_USD=$monthly_budget" >> "$GITHUB_ENV"
              echo "DAILY_BUDGET_USD=$daily_budget" >> "$GITHUB_ENV"
              echo "MONTHLY_OPERATING_CAP_USD=$monthly_operating" >> "$GITHUB_ENV"
              if test "$enabled" = "false"; then
                skip=true
                skip_reason="The countersign-aware budget shape disabled this phase."
                echo "$skip_reason"
              fi
            fi
          fi
          if test "$dry" != "true" && { test "$phase" = "mag-editorial" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; } && test "$MMA_FILES_LIVE_ENABLED" != "true"; then
            skip=true
            skip_reason="MMA Files awaits the 08d countersign and explicit live gate."
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && test "$phase" = "mma-intake" && test "$FIGHTAIQ_LIVE_ENABLED" != "true"; then
            skip=true
            skip_reason="FightAIQ intake awaits the signed founding decision and live gate."
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && test "$phase" = "mma-analysis"; then
            if test "$FIGHTAIQ_LIVE_ENABLED" != "true" || test "$FIGHTAIQ_ANALYSIS_ENABLED" != "true"; then
              skip=true
              skip_reason="FightAIQ analysis awaits the founding and budget approval gates."
              echo "$skip_reason"
            fi
          fi
          # A scheduled run forced into dry mode leaves nothing at all behind. The dry cycle writes
          # to tmp/dry-run/state, which dies with the runner; the skip recorder below needs
          # skip=true and never saw it; the commit step is gated on dry != true. The job then ends
          # green having recorded nothing, and the slot goes red with no explanation — the exact
          # shape this recorder chain exists to remove. On a schedule a forced dry is therefore a
          # skip carrying its reason. A manual dispatch keeps the dry run it asked for: no slot is
          # claimed by it, so nothing is left unexplained.
          force_dry() {
            dry=true
            echo "$1"
            if test "$scheduled" = "true"; then
              skip=true
              skip_reason="$1"
            fi
          }
          if { test "$phase" = "cu-edition" || test "$phase" = "morning" || test "$phase" = "cu-product"; } && test "$CAUGHT_UP_LIVE_ENABLED" != "true"; then
            force_dry "Caught Up live mode awaits the explicit repository-variable approval gate."
          fi
          if { test "$phase" = "cu-edition" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; } && { test "$HAS_DELIVERY_APP_ID" != "true" || test "$HAS_DELIVERY_APP_KEY" != "true"; }; then
            force_dry "Repository delivery credentials are missing, so this room could not deliver what it produced."
          fi
          if test "$delivery_only" != "true" && { test "$HAS_ANTHROPIC_KEY" != "true" || test "$HAS_OPENAI_KEY" != "true"; }; then
            force_dry "One or more council credentials are missing, so no agent could be called."
          fi
          if test "$delivery_only" = "true"; then
            # "$scheduled" as well as the event, because delivery-only is the owner's mode and the
            # Vercel cron arrives as a dispatch. It never sends this input, so this refuses a call
            # made with the dispatch token by hand rather than anything the route can produce.
            if test "$EVENT_NAME" != "workflow_dispatch" || test "$scheduled" = "true" || test "$dry" = "true"; then
              echo "Delivery-only mode requires a manual dispatch with dry=false and all matching gates open." >&2
              exit 1
            fi
            if ! { test "$phase" = "cu-edition" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; }; then
              echo "The selected phase has no repository delivery queue." >&2
              exit 1
            fi
            if test "$phase" != "cu-edition" && test "$MMA_FILES_LIVE_ENABLED" != "true"; then
              echo "MMA Files delivery-only mode requires MMA_FILES_LIVE_ENABLED=true." >&2
              exit 1
            fi
          fi
          # The double-fire guard, asked before anything is compiled, built or paid for.
          #
          # Two schedules now reach for the same slot: GitHub's crons and the Vercel cron that
          # dispatches this workflow on the hour. Both exist through the transition, so a slot can
          # be fired for twice. Neither dispatcher can tell — the Vercel route cannot see whether a
          # run is in flight, and GitHub's queue does not know what it already delivered — but the
          # run itself can, because the slot's record is a committed file named by the Prague date
          # and the phase.
          #
          # It is asked twice, of two different things, because neither alone is enough.
          #
          # The checkout answers first. `concurrency: guarded-cycle-<ref>` above serialises runs
          # and is granted before the job's first step, so by the time this checkout happened the
          # earlier run had finished and pushed.
          #
          # The branch tip answers second, and it is the one that closes the hole. A run's checkout
          # is `github.sha`, fixed when the run was created rather than when it starts; a firing
          # that sat in a queue is looking at a tree from before the other schedule committed, and
          # would see nothing on disk however carefully it looked. `git cat-file -e` against
          # origin's tip is the same question asked of the branch as it is now.
          #
          # What neither covers, plainly: a run still in flight. Nothing is committed until it
          # finishes, so two firings that genuinely overlap both see an empty slot. Only the
          # concurrency group prevents that, and only for runs in this group. A first run that
          # failed or could not push also leaves nothing, and the second firing then correctly
          # holds the meeting rather than skipping a slot that never happened.
          #
          # This is a skip and not a failure. A second firing for a slot that already ran is the
          # transition working as intended, so the job ends green. `duplicate` keeps the skip
          # recorder quiet: the slot already has a real record, and filing a skip beside it would
          # tell the calendar a meeting was called off that in fact took place.
          # The edition slot's same-day retry is exempt, and is the one deliberate second firing
          # of a phase on one date. The 05:00 run always leaves a meeting record, so this check
          # would refuse the retry before it could look at anything; the run itself decides, and
          # a morning that already published costs $0 and writes nothing.
          edition_retry=false
          if test "$phase" = "cu-edition" \
            && test "$(TZ=Europe/Prague date +%H)" = "09"; then
            edition_retry=true
          fi
          if test "$scheduled" = "true" && test "$skip" != "true" && test "$dry" != "true" && test "$phase" != "skip" && test "$edition_retry" != "true"; then
            slot="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/slot-record-cli.ts --phase "$phase")"
            candidate="$(printf '%s' "$slot" | jq -r '.path // ""')"
            recorded=""
            if test "$(printf '%s' "$slot" | jq -r '.recorded')" = "true"; then
              recorded="$candidate"
            elif test -n "$candidate" && git fetch --quiet origin "$GITHUB_REF_NAME" \
              && git cat-file -e "origin/${GITHUB_REF_NAME}:${candidate}" 2> /dev/null; then
              recorded="$candidate"
              echo "The record is on ${GITHUB_REF_NAME} but not in this run's checkout, which predates it."
            fi
            if test -n "$recorded"; then
              skip=true
              dry=true
              duplicate=true
              skip_reason="This slot already has ${recorded} for today, so this second firing ran nothing."
              echo "$skip_reason"
            fi
          fi
          # Which meeting this run is, in the log and at the top of the run page.
          #
          # A failed run named only "Guarded council cycle", so working out which meeting had been
          # lost meant downloading the log archive and matching timestamps against the cron table.
          # Three runs failed on 3 August and none of them said what they were.
          echo "::notice title=Cycle phase::phase=$phase dry=$dry skip=$skip ${skip_reason:+reason=$skip_reason}"
          {
            echo "### ${phase}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| phase | \`${phase}\` |"
            echo "| dry | \`${dry}\` |"
            echo "| skip | \`${skip}\` |"
            test -n "$skip_reason" && echo "| reason | ${skip_reason} |"
            echo "| trigger | \`${EVENT_NAME}${EVENT_SCHEDULE:+ ${EVENT_SCHEDULE}}${INPUT_TRIGGER:+ ${INPUT_TRIGGER}}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
          echo "scheduled=$scheduled" >> "$GITHUB_OUTPUT"
          echo "duplicate=$duplicate" >> "$GITHUB_OUTPUT"
          echo "delivery_only=$delivery_only" >> "$GITHUB_OUTPUT"

      # Skipped on a delivery-only dispatch, where "Run cycle" does not run, so this gate and
      # the post-cycle one would compile, test and build a byte-identical tree twice for one
      # answer. The post-cycle gate still runs in full, and every delivery step comes after
      # it, so nothing is delivered from an ungated tree.
      # A skipped slot has to leave something behind. The reason lived only in this log,
      # which expires, so the calendar showed eleven slots on 2 August as plain "missed" with
      # no way to tell a gate decision from a meeting nobody reached.
      # Not on a duplicate. That slot already holds a record of the meeting actually happening,
      # and a skip filed next to it would claim the room was called off when it was not.
      - name: Record why a scheduled meeting was skipped
        if: ${{ steps.mode.outputs.scheduled == 'true' && steps.mode.outputs.skip == 'true' && steps.mode.outputs.duplicate != 'true' && steps.mode.outputs.phase != 'skip' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
          REASON: ${{ steps.mode.outputs.skip_reason }}
        run: |
          pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/skip-cli.ts \
            --phase "$PHASE" --reason "$REASON"
          if test -n "$(git status --porcelain --untracked-files=all -- state/meetings/skips)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/meetings/skips
            git commit -m "skip(${PHASE}): ${REASON}"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash because a failed cycle leaves unrelated unstaged state behind, and
              # a plain rebase refuses to start on a dirty tree — which would drop this commit.
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the record after three attempts." >&2
              exit 1
            fi
          fi

      # Eighteen crons a day each ran agents:validate, lint, typecheck, test and build — better
      # than two minutes of runner time on 3 August — against the same source, every time. The
      # gate asks one question: does this tree build and pass? That answer cannot change while
      # the source, the config, the schemas, the prompts, the mirrored skill trees, the
      # workflows and the lockfile do not, so it is remembered rather than recomputed.
      #
      # Keyed on those bytes and not on github.sha, which was the whole reason the step never
      # paid off: a successful cycle ends by pushing a cycle(NNN) commit, so the sha is
      # different on the next cron and the entry it saved could never be found again. The gate
      # was re-run in full on nearly every run — exactly what this step exists to stop.
      #
      # state/ is deliberately absent. It is what the cycles write, and the post-cycle gate
      # below runs agents:validate, test and build over it before the cycle commit is pushed,
      # so it arrives on main already verified; the records written on the failure and skip
      # paths are covered the same way by the post-cycle gate of the next run that opens a
      # room. Letting state into the key would move the key on every cycle and put us straight
      # back where we started.
      #
      # hashFiles takes patterns, not gitignore syntax, and has no exclude — so every pattern
      # below is anchored at a directory that holds only checked-in source. A leading `**`
      # walks the whole workspace instead: state/, and, because this step runs after `pnpm
      # install`, the 8000-odd .ts files under node_modules/.pnpm as well.
      - name: Reuse the release-gate verdict for this source tree
        id: gate-cache
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release-gate-verdict
          # No restore-keys: a prefix match would hand this tree a verdict earned by other
          # bytes. Either the content is identical and the entry is found, or the gate runs.
          key: >-
            release-gate-v2-${{ hashFiles(
            'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json',
            'config/**', 'contracts/**', 'scripts/**', '.github/workflows/**',
            '.claude/skills/**', '.agents/skills/**',
            'orchestrator/package.json', 'orchestrator/tsconfig*.json',
            'orchestrator/vitest.config.ts', 'orchestrator/src/**', 'orchestrator/tests/**',
            'orchestrator/prompts/**',
            'site/package.json', 'site/tsconfig.json', 'site/*.ts', 'site/*.mjs',
            'site/src/**', 'site/tests/**',
            'studio/package.json', 'studio/tsconfig*.json', 'studio/vitest.config.ts',
            'studio/src/**', 'studio/tests/**') }}

      - name: Pre-cycle release gate
        id: gate
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.delivery_only != 'true' && steps.gate-cache.outputs.cache-hit != 'true' }}
        run: |
          # Captured, not left to abort the job. An uncaught failure here skipped every
          # remaining step including the skip recorder, so a commit that did not compile showed
          # up as a red meeting on the calendar — indistinguishable from a meeting that ran and
          # failed. The gate still stops the cycle; it just says so now.
          set +e
          {
            pnpm agents:validate \
              && pnpm lint \
              && pnpm typecheck \
              && pnpm test \
              && pnpm build
          } > "$RUNNER_TEMP/release-gate.log" 2>&1
          gate_status=$?
          set -e
          if test "$gate_status" -ne 0; then
            tail -40 "$RUNNER_TEMP/release-gate.log" >&2
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
            # Only a pass is remembered. A failure leaves no marker, nothing is saved under
            # the key, and the next run over this same source runs the gate again rather than
            # inheriting a verdict it never earned. The marker's contents are never read back;
            # it records which commit first earned the verdict for this source tree.
            echo "$GITHUB_SHA" > .release-gate-verdict
          fi

      - name: Record that the repository gate stopped this meeting
        if: ${{ steps.mode.outputs.scheduled == 'true' && steps.gate.outputs.failed == 'true' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
        run: |
          # The meeting did not fail. It never opened, because main did not build. Saying that
          # on the calendar is the difference between "look into this" and "a room went wrong".
          reason="The checks on the code behind this meeting did not pass, so it did not meet and nothing was spent."
          pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/skip-cli.ts \
            --phase "$PHASE" --reason "$reason"
          if test -n "$(git status --porcelain --untracked-files=all -- state/meetings/skips)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/meetings/skips
            git commit -m "skip(${PHASE}): repository release gate failed"
            # The loop's result is checked, as the skip recorder above already does. Left
            # unchecked, three failed pushes dropped the skip with no signal at all and the run
            # ended red with nothing on the calendar — precisely the "cause is unknown" state
            # NO_RECORD_REASON exists to describe. The step after this one fails the run anyway,
            # so this exit changes no outcome; what it changes is that the log says which record
            # was lost.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the release-gate skip for ${PHASE} after three attempts." >&2
              exit 1
            fi
          fi

      - name: Stop when the release gate failed
        if: ${{ steps.gate.outputs.failed == 'true' }}
        run: |
          echo "The repository release gate failed; the cycle did not run."
          exit 1

      - name: Run cycle
        id: run
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
          DRY: ${{ steps.mode.outputs.dry }}
          # Only the edition process receives the owner's same-day override. A job-level value
          # changes the delivery guard while the release-gate tests are running and stops the
          # workflow before the requested recovery can start.
          #
          # The Vercel cron cannot set it either. It is a schedule wearing a dispatch's clothes,
          # and the override would let a slot that already published create a second edition.
          CYCLE_FORCE_NEW_EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'cu-edition' && inputs.dry == false && inputs.trigger != 'vercel-cron' }}
          # "schedule" for the Vercel cron too. The cycle reads this to decide whether the run
          # claims a slot — whether a closed gate leaves a record, and whether the double-fire
          # guard in runCycle applies — and a punctual firing claims its slot exactly as a late
          # cron does. An owner's manual dispatch still reads "workflow_dispatch" and claims none.
          MEETING_TRIGGER: ${{ steps.mode.outputs.scheduled == 'true' && 'schedule' || github.event_name }}
        run: |
          args=(--phase "$PHASE" --explain-budget --explain-routing)
          if test "$DRY" = "true"; then
            args+=(--dry)
          fi
          set +e
          pnpm cycle -- "${args[@]}"
          cycle_status=$?
          set -e
          if test "$cycle_status" -eq 0; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the one daily portfolio digest
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.phase == 'night' }}
        env:
          CYCLE_FAILED: ${{ steps.run.outputs.failed }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          args=()
          if test "$DRY" = "true"; then args+=(--dry); fi
          if test "$CYCLE_FAILED" = "true"; then args+=(--final-failed); fi
          pnpm digest:daily -- "${args[@]}"

      - name: Send a one-time hard-limit alert when needed
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' }}
        run: pnpm budget:alert

      # Ends the job for a cycle that reported failure, before the post-cycle gate and every
      # delivery step below. The ledger is not lost by ending it here: "Record spend from a
      # failed cycle" further down carries failure(), so it still runs after this step has
      # failed the job.
      - name: Fail closed on a cycle that reported failure
        if: ${{ steps.mode.outputs.skip != 'true' && steps.run.outputs.failed == 'true' }}
        run: exit 1

      - name: Post-cycle release gate
        if: ${{ steps.mode.outputs.skip != 'true' }}
        env:
          GATE_BASE: ${{ github.sha }}
        run: |
          # Everything the cycle can write, verified. A cycle writes state, docs and social
          # assets; the tests read state, the site build renders it and agents:validate reads
          # config, so all of those have to run again on what the cycle just produced.
          #
          # Lint and typecheck read source. If the cycle changed no source file — which is the
          # normal case, because its commit allowlist is state and docs — they are being asked
          # the same question about the same bytes the pre-cycle gate already answered, and two
          # more minutes of runner time buys a guaranteed-identical result. So they run when
          # source actually moved, and are reported as skipped when it did not.
          changed="$(git diff --name-only "$GATE_BASE" -- \
            ':(glob)**/*.ts' ':(glob)**/*.tsx' ':(glob)**/*.js' ':(glob)**/*.mjs' \
            ':(glob)**/*.json' ':(glob)**/*.css' 'package.json' 'pnpm-lock.yaml' \
            ':(exclude)state/**' ':(exclude)config/kpis/**' || true)"
          pnpm agents:validate
          if test -n "$changed"; then
            echo "Source moved during this cycle; running lint and typecheck:"
            printf '%s\n' "$changed" | head -20
            pnpm lint
            pnpm typecheck
          else
            echo "No source file changed during this cycle; the pre-cycle lint and typecheck still hold."
          fi
          pnpm test
          pnpm build
          git diff --check

      - name: Production route and link smoke
        if: ${{ steps.mode.outputs.skip != 'true' }}
        run: |
          pnpm --filter @boardlessai/site start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm site:smoke

      # The ledger is the only record of what the providers billed, and it lives in the
      # workspace until something commits it. The atomic cycle commit below carries no
      # always(), so a run that paid for calls and then failed took its own ledger to the grave
      # with the runner: two runs on 2 August spent about $0.10 between them and the month reads
      # as if neither happened. Only spend and the pending notices are committed here; the
      # atomic cycle commit still owns everything else.
      - name: Record spend from a failed cycle
        # A failure path only. Under always() this also fired on healthy runs, pushing state to
        # main before the post-cycle gate above had passed on it. Two ways in, because the two
        # kinds of failure look different from here: failure() covers any step that failed
        # outright — the gate, the smoke test, "Fail closed on a cycle that reported failure" —
        # and the outputs clause covers a failed cycle directly, since "Run cycle" captures its
        # own exit status and returns 0. Standing after the gate and the smoke test means a
        # cycle that exited 0, billed for calls and then tripped either of them is covered too.
        # The porcelain check makes this a no-op when there is nothing left to record.
        if: ${{ (failure() || steps.run.outputs.failed == 'true') && steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' }}
        run: |
          if test -n "$(git status --porcelain --untracked-files=all -- state/budget state/notify)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/budget state/notify
            git commit -m "ledger(${{ steps.mode.outputs.phase }}): record spend the cycle commit did not take"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash because a failed cycle leaves unrelated unstaged state behind, and
              # a plain rebase refuses to start on a dirty tree — which would drop this commit.
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the record after three attempts." >&2
              exit 1
            fi
          fi

      - name: Commit one atomic runtime cycle
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        env:
          CYCLE_NUMBER: ${{ github.run_number }}
          # The Vercel cron reads as a schedule here as well, so a punctual run that finished
          # without writing anything still leaves the stated reason a scheduled slot is owed
          # instead of the quiet exit 0 a manual dispatch gets.
          EVENT_NAME: ${{ steps.mode.outputs.scheduled == 'true' && 'schedule' || github.event_name }}
          PHASE: ${{ steps.mode.outputs.phase }}
        run: |
          runtime_paths=(
            config/visual-weights config/ventures.json state/autonomy state/budget state/standups state/meetings
            state/scorecards state/decisions state/calendar state/edition state/ideas state/meeting-agendas state/priority-queue.json
            state/kpis state/money state/mma state/notify state/social state/taste state/ventures state/INBOX.md
            NEEDS_YOUR_HELP_NOW.md
            docs/ECOSYSTEM.md
            site/public/social
          )
          for runtime_path in "${runtime_paths[@]}"; do
            if test -e "$runtime_path" || git ls-files --error-unmatch -- "$runtime_path" > /dev/null 2>&1; then
              git add -A -- "$runtime_path"
            fi
          done
          git config user.name "boardlessai-cycle[bot]"
          git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
          # A live cycle that staged nothing used to end the run green, right here, with no commit
          # and no record anywhere — the terminal silent path, and the last one on the write side.
          # It happens when every write a phase made landed outside runtime_paths above, or when a
          # phase returned without writing at all. Either way a scheduled slot has nothing to show,
          # so it is told that in as many words rather than left red and unexplained, and the run
          # then fails: a scheduled meeting that produced no canonical state is a defect, and a
          # green run is how it stayed invisible. A dispatch claims no slot, so it keeps the old
          # quiet exit and only says so in the log.
          if git diff --cached --quiet; then
            echo "Cycle produced no canonical state change."
            test "$EVENT_NAME" = "schedule" || exit 0
            if test -n "$PHASE" && test "$PHASE" != "skip"; then
              pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/skip-cli.ts \
                --phase "$PHASE" \
                --reason "The run behind this meeting finished without writing anything down about it."
              if test -n "$(git status --porcelain --untracked-files=all -- state/meetings/skips)"; then
                git add -A -- state/meetings/skips
                git commit -m "skip(${PHASE}): the cycle wrote no canonical state"
                pushed=false
                for attempt in 1 2 3; do
                  if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
                  git fetch origin "$GITHUB_REF_NAME"
                  git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
                done
                if test "$pushed" != "true"; then
                  echo "Could not push the record after three attempts." >&2
                fi
              fi
            fi
            exit 1
          fi
          git commit -m "cycle(${CYCLE_NUMBER})"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "Runtime push raced with a newer ${GITHUB_REF_NAME}; refetching before retry ${attempt}."
            git fetch origin "$GITHUB_REF_NAME"
            # --autostash, because the cycle commits only its allowlisted paths and anything else
              # the run touched stays unstaged. Without it the rebase refuses outright with "cannot
              # rebase: You have unstaged changes", both retries fail the same way, and a meeting that
              # already ran and already cost money is thrown away with its records.
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              break
            fi
          done
          if test "$pushed" != "true"; then
            echo "Runtime state could not be pushed after two refetches. The existing cycle commit was not regenerated."
            exit 1
          fi

      - name: Select the oldest Caught Up delivery
        id: delivery
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.phase == 'cu-edition' && steps.mode.outputs.dry != 'true' }}
        run: pnpm delivery -- next --github-output "$GITHUB_OUTPUT"

      - name: Mint bounded aifirst installation token
        id: delivery-token
        if: ${{ steps.delivery.outputs.has_package == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          owner: lukaskourilcz
          repositories: aifirst

      - name: Deliver package to aifirst main
        id: target
        if: ${{ steps.delivery.outputs.has_package == 'true' }}
        env:
          DELIVERY_TOKEN: ${{ steps.delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.delivery.outputs.package_path }}
          PACKAGE_STATUS: ${{ steps.delivery.outputs.package_status }}
          PACKAGE_DATE: ${{ steps.delivery.outputs.date }}
          PACKAGE_HASH12: ${{ steps.delivery.outputs.hash12 }}
          PACKAGE_SLUG: ${{ steps.delivery.outputs.slug }}
          IMAGE_HERO_PATH: ${{ steps.delivery.outputs.image_hero_path }}
          IMAGE_THUMB_PATH: ${{ steps.delivery.outputs.image_thumb_path }}
        run: |
          clone_root=""
          for attempt in 1 2; do
            candidate="$RUNNER_TEMP/aifirst-delivery-$attempt"
            if git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$candidate"; then
              clone_root="$candidate"
              break
            fi
          done
          if test -z "$clone_root"; then
            echo "GitHub was unreachable after one retry; the package remains in the outbox."
            exit 1
          fi
          pnpm --dir "$clone_root" install --frozen-lockfile
          set +e
          pnpm --dir "$clone_root" consume:edition "$PACKAGE_PATH" "$clone_root" > "$RUNNER_TEMP/delivery-consumer.log" 2>&1
          consumer_status=$?
          set -e
          if test "$consumer_status" -ne 0; then
            cat "$RUNNER_TEMP/delivery-consumer.log"
            if grep -q '\[delivery:hash_conflict\]' "$RUNNER_TEMP/delivery-consumer.log"; then
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=hash_conflict" >> "$GITHUB_OUTPUT"
            elif grep -q '\[delivery:content_invalid\]' "$RUNNER_TEMP/delivery-consumer.log"; then
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            else
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=schema_invalid" >> "$GITHUB_OUTPUT"
            fi
            echo "detail_file=$RUNNER_TEMP/delivery-consumer.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same gate the MMA path runs before it commits. Caught Up used to check content
          # only, so a change that content-checked but broke the build was pushed, Vercel went
          # red, target-ci resolved to failure and the verifier reverted the fresh commit — the
          # day's edition lost, and the site briefly serving a broken deploy, to learn something
          # a local build would have said first. Captured, because uncaptured under bash -e it
          # aborts before any status= line and both the receipt and fail-closed steps skip.
          set +e
          {
            pnpm --dir "$clone_root" check:content \
              && pnpm --dir "$clone_root" test \
              && pnpm --dir "$clone_root" typecheck \
              && pnpm --dir "$clone_root" build
          } > "$RUNNER_TEMP/delivery-content.log" 2>&1
          content_status=$?
          set -e
          if test "$content_status" -ne 0; then
            tail -40 "$RUNNER_TEMP/delivery-content.log" >&2
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/delivery-content.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          allowed="^public/data/board/${PACKAGE_DATE}\.json$"
          if test "$PACKAGE_STATUS" = "edition"; then
            allowed="^((content/articles/${PACKAGE_DATE}\.(en|cs)\.mdx)|(public/data/board/${PACKAGE_DATE}\.json)|(public/images/editions/${PACKAGE_SLUG}/(hero|thumb)\.(webp|png|svg)))$"
          fi
          unexpected="$(git -C "$clone_root" status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Consumer touched unauthorized paths:"
            echo "$unexpected"
            exit 1
          fi
          git -C "$clone_root" add \
            "public/data/board/${PACKAGE_DATE}.json"
          if test "$PACKAGE_STATUS" = "edition"; then
            # Czech is the locale that is always written; English is optional and on its way
            # out. git add is fatal on a pathspec that matches nothing, and this step runs
            # under bash -e, so naming the English file unconditionally would abort here —
            # after the consumer had already written everything. status= would stay empty,
            # 'Record the delivery transaction' is gated on it being non-empty and would be
            # skipped, and the edition would be lost for the day with almost no signal.
            git -C "$clone_root" add "content/articles/${PACKAGE_DATE}.cs.mdx" "$IMAGE_HERO_PATH" "$IMAGE_THUMB_PATH"
            if test -f "$clone_root/content/articles/${PACKAGE_DATE}.en.mdx"; then
              git -C "$clone_root" add "content/articles/${PACKAGE_DATE}.en.mdx"
            fi
          fi
          echo "created_commit=false" >> "$GITHUB_OUTPUT"
          if ! git -C "$clone_root" diff --cached --quiet; then
            git -C "$clone_root" config user.name "boardlessai-delivery[bot]"
            git -C "$clone_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
            git -C "$clone_root" commit -m "edition(${PACKAGE_DATE}): ${PACKAGE_SLUG} [package:${PACKAGE_HASH12}]"
            echo "created_commit=true" >> "$GITHUB_OUTPUT"
            pushed=false
            for attempt in 1 2; do
              if git -C "$clone_root" push origin HEAD:main; then
                pushed=true
                break
              fi
              git -C "$clone_root" fetch --depth 1 origin main
              if ! git -C "$clone_root" rebase --autostash origin/main; then
                git -C "$clone_root" rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              printf '%s\n' "Target push was rejected after one refetch/retry." > "$RUNNER_TEMP/delivery-push.log"
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=push_rejected" >> "$GITHUB_OUTPUT"
              echo "detail_file=$RUNNER_TEMP/delivery-push.log" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "status=delivered" >> "$GITHUB_OUTPUT"
          echo "target_commit=$(git -C "$clone_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Caught Up production release
        id: cu-proof
        if: ${{ steps.delivery.outputs.has_package == 'true' && steps.delivery.outputs.package_status == 'edition' && steps.target.outputs.status == 'delivered' }}
        env:
          DELIVERY_TOKEN: ${{ steps.delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.delivery.outputs.hash }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          CREATED_COMMIT: ${{ steps.target.outputs.created_commit }}
        run: |
          proof_status=failed
          for retry in 0 1; do
            set +e
            pnpm release:verify -- \
              --venture caught-up \
              --package "$PACKAGE_PATH" \
              --target-commit "$TARGET_COMMIT" \
              --deployment-url "${CAUGHT_UP_SITE_URL:-https://caughtup-ai.vercel.app}" \
              --github-token "$DELIVERY_TOKEN" \
              --retry-count "$retry" \
              --timeout-ms 300000
            verifier_status=$?
            set -e
            if test "$verifier_status" -eq 0; then
              proof_status=passed
              break
            fi
            if test "$retry" -eq 0; then
              retry_root="$RUNNER_TEMP/aifirst-idempotent-retry"
              git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$retry_root"
              pnpm --dir "$retry_root" install --frozen-lockfile
              pnpm --dir "$retry_root" consume:edition "$PACKAGE_PATH" "$retry_root"
            fi
          done
          revert_commit=""
          if test "$proof_status" != "passed"; then
            if test "$CREATED_COMMIT" = "true"; then
              revert_root="$RUNNER_TEMP/aifirst-release-revert"
              git clone "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$revert_root"
              git -C "$revert_root" config user.name "boardlessai-delivery[bot]"
              git -C "$revert_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
              if git -C "$revert_root" revert --no-edit "$TARGET_COMMIT" && git -C "$revert_root" push origin HEAD:main; then
                revert_commit="$(git -C "$revert_root" rev-parse HEAD)"
              fi
            fi
            fail_args=(fail-closed --venture caught-up --package-hash "$PACKAGE_HASH")
            if test -n "$revert_commit"; then fail_args+=(--revert-commit "$revert_commit"); fi
            pnpm release:verify -- "${fail_args[@]}"
          fi
          echo "status=$proof_status" >> "$GITHUB_OUTPUT"
          echo "revert_commit=$revert_commit" >> "$GITHUB_OUTPUT"

      - name: Record the delivery transaction
        if: ${{ steps.delivery.outputs.has_package == 'true' && steps.target.outputs.status != '' }}
        env:
          DELIVERY_STATUS: ${{ steps.target.outputs.status }}
          FAILURE_CODE: ${{ steps.target.outputs.failure_code }}
          DETAIL_FILE: ${{ steps.target.outputs.detail_file }}
          PACKAGE_STATE_PATH: ${{ steps.delivery.outputs.package_state_path }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          PACKAGE_DATE: ${{ steps.delivery.outputs.date }}
          PACKAGE_HASH12: ${{ steps.delivery.outputs.hash12 }}
          PROOF_STATUS: ${{ steps.cu-proof.outputs.status }}
        run: |
          if test "$PROOF_STATUS" = "failed"; then
            DELIVERY_STATUS=needs_reconciliation
            FAILURE_CODE=post_deploy_verification
          fi
          args=(record --package "$PACKAGE_STATE_PATH" --status "$DELIVERY_STATUS")
          if test -n "$FAILURE_CODE"; then args+=(--code "$FAILURE_CODE"); fi
          if test -n "$DETAIL_FILE"; then args+=(--detail-file "$DETAIL_FILE"); fi
          if test -n "$TARGET_COMMIT"; then args+=(--target-commit "$TARGET_COMMIT"); fi
          pnpm delivery -- "${args[@]}"
          receipt_paths=(state/edition state/meetings state/release-proofs state/notify state/ventures/caught-up state/INBOX.md)
          for receipt_path in "${receipt_paths[@]}"; do
            if test -e "$receipt_path" || git ls-files --error-unmatch -- "$receipt_path" > /dev/null 2>&1; then
              git add -A -- "$receipt_path"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git commit -m "delivery(${PACKAGE_DATE}): ${DELIVERY_STATUS} [package:${PACKAGE_HASH12}]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              echo "Delivery receipt push raced with a newer ${GITHUB_REF_NAME}; refetching before retry ${attempt}."
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash, because the cycle commits only its allowlisted paths and anything else
              # the run touched stays unstaged. Without it the rebase refuses outright with "cannot
              # rebase: You have unstaged changes", both retries fail the same way, and a meeting that
              # already ran and already cost money is thrown away with its records.
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              echo "Delivery receipt could not be pushed after two refetches."
              exit 1
            fi
          fi

      - name: Fail closed on delivery reconciliation
        if: ${{ steps.target.outputs.status == 'needs_reconciliation' || steps.cu-proof.outputs.status == 'failed' }}
        run: exit 1

      - name: Select pending MMA Files delivery
        id: mma-delivery
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' && vars.MMA_FILES_LIVE_ENABLED == 'true' && (steps.mode.outputs.phase == 'mma-intake' || steps.mode.outputs.phase == 'mma-analysis' || steps.mode.outputs.phase == 'article-am' || steps.mode.outputs.phase == 'article-pm' || steps.mode.outputs.phase == 'mag-desk') }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
        run: |
          package_kind=article
          if test "$PHASE" = "mma-intake" || test "$PHASE" = "mma-analysis"; then
            package_kind=fightaiq
          fi
          pnpm mma:delivery -- next --kind "$package_kind" --github-output "$GITHUB_OUTPUT"

      - name: Mint bounded MMA Files installation token
        id: mma-delivery-token
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          owner: lukaskourilcz
          repositories: mma-files

      - name: Deliver package to MMA Files main
        id: mma-target
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' }}
        env:
          DELIVERY_TOKEN: ${{ steps.mma-delivery-token.outputs.token }}
          PACKAGE_KIND: ${{ steps.mma-delivery.outputs.package_kind }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH12: ${{ steps.mma-delivery.outputs.package_hash12 }}
          PACKAGE_LABEL: ${{ steps.mma-delivery.outputs.package_label }}
          PACKAGE_SLUG: ${{ steps.mma-delivery.outputs.package_slug }}
          IMAGE_HERO_PATH: ${{ steps.mma-delivery.outputs.image_hero_path }}
          IMAGE_THUMB_PATH: ${{ steps.mma-delivery.outputs.image_thumb_path }}
        run: |
          clone_root=""
          for attempt in 1 2; do
            candidate="$RUNNER_TEMP/mma-files-delivery-$attempt"
            if git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$candidate"; then
              clone_root="$candidate"
              break
            fi
          done
          if test -z "$clone_root"; then
            printf '%s\n' "GitHub was unreachable after one retry." > "$RUNNER_TEMP/mma-delivery-error.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=unreachable" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm --prefix "$clone_root" ci
          set +e
          npm --prefix "$clone_root" run consume:boardless -- "$PACKAGE_PATH" "$clone_root" > "$RUNNER_TEMP/mma-consumer.log" 2>&1
          consumer_status=$?
          set -e
          if test "$consumer_status" -ne 0; then
            cat "$RUNNER_TEMP/mma-consumer.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            if grep -q '\[delivery:hash_conflict\]' "$RUNNER_TEMP/mma-consumer.log"; then
              echo "failure_code=hash_conflict" >> "$GITHUB_OUTPUT"
            elif grep -q '\[delivery:content_invalid\]' "$RUNNER_TEMP/mma-consumer.log"; then
              echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            else
              echo "failure_code=schema_invalid" >> "$GITHUB_OUTPUT"
            fi
            echo "detail_file=$RUNNER_TEMP/mma-consumer.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          allowed="^((data/boardless/articles\.json)|(public/images/articles/${PACKAGE_SLUG}/(hero|thumb)\.(webp|png|svg)))$"
          if test "$PACKAGE_KIND" = "fightaiq"; then
            allowed='^data/boardless/fightaiq\.json$'
          fi
          unexpected="$(git -C "$clone_root" status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            printf '%s\n%s\n' "Consumer touched unauthorized paths:" "$unexpected" > "$RUNNER_TEMP/mma-delivery-error.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The target repository's own gates, captured like every other failure in this step.
          # Uncaptured they abort before any status= line is written, so the receipt step and
          # the fail-closed step both silently skip and the incident leaves no durable record.
          set +e
          {
            npm --prefix "$clone_root" run test \
              && npm --prefix "$clone_root" run typecheck \
              && NEXT_PUBLIC_SITE_URL=https://mma-files.vercel.app NEXT_PUBLIC_DEMO_MODE=false npm --prefix "$clone_root" run build
          } > "$RUNNER_TEMP/mma-target-gate.log" 2>&1
          gate_status=$?
          set -e
          if test "$gate_status" -ne 0; then
            tail -40 "$RUNNER_TEMP/mma-target-gate.log" >&2
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=target_gate_failed" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-target-gate.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$PACKAGE_KIND" = "article"; then
            git -C "$clone_root" add data/boardless/articles.json "$IMAGE_HERO_PATH" "$IMAGE_THUMB_PATH"
          else
            git -C "$clone_root" add data/boardless/fightaiq.json
          fi
          echo "created_commit=false" >> "$GITHUB_OUTPUT"
          if ! git -C "$clone_root" diff --cached --quiet; then
            git -C "$clone_root" config user.name "boardlessai-delivery[bot]"
            git -C "$clone_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
            git -C "$clone_root" commit -m "delivery(${PACKAGE_KIND}): ${PACKAGE_LABEL} [package:${PACKAGE_HASH12}]"
            echo "created_commit=true" >> "$GITHUB_OUTPUT"
            pushed=false
            for attempt in 1 2; do
              if git -C "$clone_root" push origin HEAD:main; then
                pushed=true
                break
              fi
              git -C "$clone_root" fetch --depth 1 origin main
              if ! git -C "$clone_root" rebase --autostash origin/main; then
                git -C "$clone_root" rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              printf '%s\n' "Target push was rejected after one refetch/retry." > "$RUNNER_TEMP/mma-delivery-error.log"
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=push_rejected" >> "$GITHUB_OUTPUT"
              echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "status=delivered" >> "$GITHUB_OUTPUT"
          echo "target_commit=$(git -C "$clone_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify MMA Files production article
        id: mma-proof
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' && steps.mma-delivery.outputs.package_kind == 'article' && steps.mma-target.outputs.status == 'delivered' }}
        env:
          DELIVERY_TOKEN: ${{ steps.mma-delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.mma-delivery.outputs.package_hash }}
          TARGET_COMMIT: ${{ steps.mma-target.outputs.target_commit }}
          CREATED_COMMIT: ${{ steps.mma-target.outputs.created_commit }}
        run: |
          proof_status=failed
          for retry in 0 1; do
            set +e
            pnpm release:verify -- \
              --venture mma-files \
              --package "$PACKAGE_PATH" \
              --target-commit "$TARGET_COMMIT" \
              --deployment-url "${MMA_FILES_SITE_URL:-https://mma-files.vercel.app}" \
              --github-token "$DELIVERY_TOKEN" \
              --retry-count "$retry" \
              --timeout-ms 300000
            verifier_status=$?
            set -e
            if test "$verifier_status" -eq 0; then
              proof_status=passed
              break
            fi
            if test "$retry" -eq 0; then
              retry_root="$RUNNER_TEMP/mma-files-idempotent-retry"
              git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$retry_root"
              npm --prefix "$retry_root" ci
              npm --prefix "$retry_root" run consume:boardless -- "$PACKAGE_PATH" "$retry_root"
            fi
          done
          revert_commit=""
          if test "$proof_status" != "passed"; then
            if test "$CREATED_COMMIT" = "true"; then
              revert_root="$RUNNER_TEMP/mma-files-release-revert"
              git clone "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$revert_root"
              git -C "$revert_root" config user.name "boardlessai-delivery[bot]"
              git -C "$revert_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
              if git -C "$revert_root" revert --no-edit "$TARGET_COMMIT" && git -C "$revert_root" push origin HEAD:main; then
                revert_commit="$(git -C "$revert_root" rev-parse HEAD)"
              fi
            fi
            fail_args=(fail-closed --venture mma-files --package-hash "$PACKAGE_HASH")
            if test -n "$revert_commit"; then fail_args+=(--revert-commit "$revert_commit"); fi
            pnpm release:verify -- "${fail_args[@]}"
          fi
          echo "status=$proof_status" >> "$GITHUB_OUTPUT"
          echo "revert_commit=$revert_commit" >> "$GITHUB_OUTPUT"

      - name: Record MMA Files delivery transaction
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' && steps.mma-target.outputs.status != '' }}
        env:
          DELIVERY_STATUS: ${{ steps.mma-target.outputs.status }}
          FAILURE_CODE: ${{ steps.mma-target.outputs.failure_code }}
          DETAIL_FILE: ${{ steps.mma-target.outputs.detail_file }}
          PACKAGE_KIND: ${{ steps.mma-delivery.outputs.package_kind }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.mma-delivery.outputs.package_hash }}
          PACKAGE_HASH12: ${{ steps.mma-delivery.outputs.package_hash12 }}
          TARGET_COMMIT: ${{ steps.mma-target.outputs.target_commit }}
          PROOF_STATUS: ${{ steps.mma-proof.outputs.status }}
        run: |
          if test "$PROOF_STATUS" = "failed"; then
            DELIVERY_STATUS=needs_reconciliation
            FAILURE_CODE=post_deploy_verification
          fi
          args=(record --kind "$PACKAGE_KIND" --package "$PACKAGE_PATH" --hash "$PACKAGE_HASH" --status "$DELIVERY_STATUS")
          if test -n "$FAILURE_CODE"; then args+=(--code "$FAILURE_CODE"); fi
          if test -n "$DETAIL_FILE"; then args+=(--detail-file "$DETAIL_FILE"); fi
          if test -n "$TARGET_COMMIT"; then args+=(--target-commit "$TARGET_COMMIT"); fi
          pnpm mma:delivery -- "${args[@]}"
          receipt_paths=(state/ventures/mma-files/deliveries state/ventures/fightaiq/deliveries state/release-proofs state/notify state/ventures/mma-files/PAUSED state/INBOX.md)
          for receipt_path in "${receipt_paths[@]}"; do
            if test -e "$receipt_path" || git ls-files --error-unmatch -- "$receipt_path" > /dev/null 2>&1; then
              git add -A -- "$receipt_path"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git commit -m "delivery(mma-files): ${DELIVERY_STATUS} [package:${PACKAGE_HASH12}]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash, because the cycle commits only its allowlisted paths and anything else
              # the run touched stays unstaged. Without it the rebase refuses outright with "cannot
              # rebase: You have unstaged changes", both retries fail the same way, and a meeting that
              # already ran and already cost money is thrown away with its records.
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              echo "MMA Files delivery receipt could not be pushed after two refetches."
              exit 1
            fi
          fi

      - name: Fail closed on MMA Files delivery reconciliation
        if: ${{ steps.mma-target.outputs.status == 'needs_reconciliation' || steps.mma-proof.outputs.status == 'failed' }}
        run: exit 1

      # A red slot on the calendar with nothing anywhere saying why is the thing the owner keeps
      # having to ask about. The release gate has its own recorder above; this covers the two
      # other ways a meeting never happens — the cycle itself failed, or a step before it did,
      # so the room never opened — and the slot reads "Skipped" with the reason instead of
      # "Did not happen" with silence.
      - name: Say on the calendar why this run did not finish
        # Read the output "Run cycle" writes, not its outcome. That step captures the cycle's
        # exit status and returns 0 on every path, so steps.run.outcome is 'success' even for a
        # cycle that failed and the old `outcome != 'success'` clause could never be true once
        # the step had run. `failed` is written on both of its branches: 'true' for a cycle that
        # failed, 'false' for one that finished, and empty when an earlier step failed and this
        # one was skipped — so != 'false' is exactly the two cases worth a note. It stays quiet
        # for a meeting that ran: a delivery step failing after that is a delivery problem, and
        # calling it "the meeting never finished" is the opposite of what happened.
        if: ${{ failure() && steps.mode.outputs.scheduled == 'true' && steps.mode.outputs.skip != 'true' && steps.gate.outputs.failed != 'true' && steps.run.outputs.failed != 'false' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -- . 2>/dev/null || true
          git reset --hard "origin/$GITHUB_REF_NAME"
          # PHASE is empty when "Resolve guarded cycle mode" is itself what failed — so the run
          # that failed earliest was the one guaranteed to leave no trace at all. The cron that
          # fired names the slot on its own, exactly as the mode step derives it, so the name is
          # recovered here rather than given up on. If that resolution also fails there is
          # genuinely nothing to file the skip under and the step stops, which is the one case
          # left where a run can end without naming its slot.
          #
          # A Vercel-cron firing carries no cron expression, so the fallback reads the dispatch
          # input the route set instead. Same recovery, different place the slot's name was
          # written down; without it the punctual path would be the one shape of scheduled run
          # that can still fail early and leave the slot unexplained.
          if test -z "$PHASE"; then
            PHASE="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts \
              --scheduled --cron "$EVENT_SCHEDULE" --json | jq -r '.slot // ""')" || PHASE=""
          fi
          if test -z "$PHASE"; then
            PHASE="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts \
              --phase "$INPUT_PHASE")" || PHASE=""
          fi
          test -n "$PHASE" && test "$PHASE" != "skip" || exit 0
          reason="The run behind this meeting failed before it finished."
          pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/skip-cli.ts \
            --phase "$PHASE" --reason "$reason" || exit 0
          if test -n "$(git status --porcelain --untracked-files=all -- state/meetings/skips)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/meetings/skips
            git commit -m "skip(${PHASE}): the run failed before the meeting finished"
            # Checked, like the skip recorder at the top of the job. Three failed pushes used to
            # drop this record silently, leaving the run red and the slot unexplained — the one
            # outcome this step exists to prevent. The run has already failed, so the exit only
            # makes the loss visible in the log.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the failure skip for ${PHASE} after three attempts." >&2
              exit 1
            fi
          fi
