name: Guarded council cycle

on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Council phase
        required: true
        default: morning
        type: choice
        options:
          - cu-edition
          - morning
          - afternoon
          - cu-product
          - tt-marketing
          - incubator-scan
          - incubator-synthesis
          - mma-intake
          - mag-editorial
          - article-am
          - article-pm
          - mma-analysis
          - mag-desk
          - studio
          - night
      dry:
        description: Never call paid APIs or write canonical state
        required: true
        default: true
        type: boolean
      delivery_only:
        description: Deliver pending content for the selected Caught Up or MMA phase without paid model calls
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: guarded-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cycle:
    name: Run bounded council cycle
    if: ${{ vars.AUTONOMY_KILL_SWITCH != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      # The live switches must reach the cycle itself, not only the step that decides
      # whether to skip. They were declared on "Resolve guarded cycle mode" alone, so a
      # dispatched mma-intake passed the skip check and then paused itself:
      # portfolio/run.ts:467 reads process.env.PORTFOLIO_LIVE_ENABLED, saw undefined and
      # returned status "paused" with zero agents. cycle.ts:847 re-checks the MMA switch the
      # same way. That silently blocked every portfolio phase — tt-marketing, both incubator
      # rooms, mma-intake, mma-analysis, mag-editorial, mag-desk and studio.
      CAUGHT_UP_LIVE_ENABLED: ${{ vars.CAUGHT_UP_LIVE_ENABLED }}
      PORTFOLIO_LIVE_ENABLED: ${{ vars.PORTFOLIO_LIVE_ENABLED }}
      FIGHTAIQ_LIVE_ENABLED: ${{ vars.FIGHTAIQ_LIVE_ENABLED }}
      FIGHTAIQ_ANALYSIS_ENABLED: ${{ vars.FIGHTAIQ_ANALYSIS_ENABLED }}
      MMA_FILES_LIVE_ENABLED: ${{ vars.MMA_FILES_LIVE_ENABLED }}
      MONTHLY_OPERATING_CAP_USD: "30"
      MAX_CYCLE_BUDGET_USD: "0.20"
      CU_MEETING_BUDGET_USD: "0.08"
      EDITION_PRODUCTION_BUDGET_USD: "0.35"
      DAILY_BUDGET_USD: "1.00"
      MONTHLY_BUDGET_USD: "25"
      DIGEST_BUDGET_USD: "0.02"
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      CAUGHT_UP_SITE_URL: ${{ vars.CAUGHT_UP_SITE_URL }}
      MMA_FILES_SITE_URL: ${{ vars.MMA_FILES_SITE_URL }}
      MMA_FILES_INDEXING_ENABLED: ${{ vars.MMA_FILES_INDEXING_ENABLED }}
      DAILY_DIGEST_EMAIL_MODE: ${{ vars.DAILY_DIGEST_EMAIL_MODE }}
      DAILY_DIGEST_EMAIL_FROM: ${{ vars.DAILY_DIGEST_EMAIL_FROM }}
      DAILY_DIGEST_EMAIL_TO: ${{ secrets.DAILY_DIGEST_EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FREE_TIER_MONTHLY: ${{ vars.RESEND_FREE_TIER_MONTHLY }}
      RESEND_FREE_TIER_DAILY: ${{ vars.RESEND_FREE_TIER_DAILY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Honor repository kill switch
        run: |
          if test -e state/PAUSED; then
            echo "state/PAUSED is present; refusing to run."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve guarded cycle mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_DRY: ${{ inputs.dry }}
          INPUT_DELIVERY_ONLY: ${{ inputs.delivery_only }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_DELIVERY_APP_ID: ${{ secrets.DELIVERY_APP_ID != '' }}
          HAS_DELIVERY_APP_KEY: ${{ secrets.DELIVERY_APP_PRIVATE_KEY != '' }}
          CAUGHT_UP_LIVE_ENABLED: ${{ vars.CAUGHT_UP_LIVE_ENABLED }}
          PORTFOLIO_LIVE_ENABLED: ${{ vars.PORTFOLIO_LIVE_ENABLED }}
          FIGHTAIQ_LIVE_ENABLED: ${{ vars.FIGHTAIQ_LIVE_ENABLED }}
          FIGHTAIQ_ANALYSIS_ENABLED: ${{ vars.FIGHTAIQ_ANALYSIS_ENABLED }}
          MMA_FILES_LIVE_ENABLED: ${{ vars.MMA_FILES_LIVE_ENABLED }}
        run: |
          phase="${INPUT_PHASE:-morning}"
          dry="${INPUT_DRY:-true}"
          skip_reason=""
          delivery_only="${INPUT_DELIVERY_ONLY:-false}"
          if test "$EVENT_NAME" = "schedule"; then
            dry=false
            phase="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts --scheduled --cron "$EVENT_SCHEDULE")"
          else
            phase="$(pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/clock-cli.ts --phase "$phase")"
          fi
          skip=false
          if test "$phase" = "skip"; then
            skip=true
            dry=true
            skip_reason="The inactive DST cron variant has no Prague wall-clock meeting."
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && { test "$phase" = "tt-marketing" || test "$phase" = "incubator-scan" || test "$phase" = "incubator-synthesis" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "mag-editorial" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk" || test "$phase" = "studio"; }; then
            if test "$PORTFOLIO_LIVE_ENABLED" != "true"; then
              skip=true
              skip_reason="Portfolio meeting crons await explicit owner approval."
              echo "$skip_reason"
            else
              schedule_json="$(pnpm --filter @boardlessai/orchestrator exec tsx src/portfolio/schedule-cli.ts --phase "$phase")"
              enabled="$(printf '%s' "$schedule_json" | jq -r '.enabled')"
              monthly_budget="$(printf '%s' "$schedule_json" | jq -r '.monthlyBudgetUsd')"
              daily_budget="$(printf '%s' "$schedule_json" | jq -r '.dailyBudgetUsd')"
              monthly_operating="$(printf '%s' "$schedule_json" | jq -r '.monthlyOperatingUsd')"
              echo "MONTHLY_BUDGET_USD=$monthly_budget" >> "$GITHUB_ENV"
              echo "DAILY_BUDGET_USD=$daily_budget" >> "$GITHUB_ENV"
              echo "MONTHLY_OPERATING_CAP_USD=$monthly_operating" >> "$GITHUB_ENV"
              if test "$enabled" = "false"; then
                skip=true
                skip_reason="The countersign-aware budget shape disabled this phase."
                echo "$skip_reason"
              fi
            fi
          fi
          if test "$dry" != "true" && { test "$phase" = "mag-editorial" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; } && test "$MMA_FILES_LIVE_ENABLED" != "true"; then
            skip=true
            skip_reason="MMA Files awaits the 08d countersign and explicit live gate."
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && test "$phase" = "mma-intake" && test "$FIGHTAIQ_LIVE_ENABLED" != "true"; then
            skip=true
            skip_reason="FightAIQ intake awaits the signed founding decision and live gate."
            echo "$skip_reason"
          fi
          if test "$dry" != "true" && test "$phase" = "mma-analysis"; then
            if test "$FIGHTAIQ_LIVE_ENABLED" != "true" || test "$FIGHTAIQ_ANALYSIS_ENABLED" != "true"; then
              skip=true
              skip_reason="FightAIQ analysis awaits the founding and budget approval gates."
              echo "$skip_reason"
            fi
          fi
          if { test "$phase" = "cu-edition" || test "$phase" = "morning" || test "$phase" = "cu-product"; } && test "$CAUGHT_UP_LIVE_ENABLED" != "true"; then
            dry=true
            echo "Caught Up live mode awaits the explicit repository-variable approval gate."
          fi
          if { test "$phase" = "cu-edition" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; } && { test "$HAS_DELIVERY_APP_ID" != "true" || test "$HAS_DELIVERY_APP_KEY" != "true"; }; then
            dry=true
            echo "Repository delivery credentials are missing; forcing fixture-only dry mode."
          fi
          if test "$delivery_only" != "true" && { test "$HAS_ANTHROPIC_KEY" != "true" || test "$HAS_OPENAI_KEY" != "true"; }; then
            dry=true
            echo "One or more council credentials are missing; forcing fixture-only dry mode."
          fi
          if test "$delivery_only" = "true"; then
            if test "$EVENT_NAME" != "workflow_dispatch" || test "$dry" = "true"; then
              echo "Delivery-only mode requires a manual dispatch with dry=false and all matching gates open." >&2
              exit 1
            fi
            if ! { test "$phase" = "cu-edition" || test "$phase" = "mma-intake" || test "$phase" = "mma-analysis" || test "$phase" = "article-am" || test "$phase" = "article-pm" || test "$phase" = "mag-desk"; }; then
              echo "The selected phase has no repository delivery queue." >&2
              exit 1
            fi
            if test "$phase" != "cu-edition" && test "$MMA_FILES_LIVE_ENABLED" != "true"; then
              echo "MMA Files delivery-only mode requires MMA_FILES_LIVE_ENABLED=true." >&2
              exit 1
            fi
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
          echo "delivery_only=$delivery_only" >> "$GITHUB_OUTPUT"

      # Skipped on a delivery-only dispatch, where "Run cycle" does not run, so this gate and
      # the post-cycle one would compile, test and build a byte-identical tree twice for one
      # answer. The post-cycle gate still runs in full, and every delivery step comes after
      # it, so nothing is delivered from an ungated tree.
      # A skipped slot has to leave something behind. The reason lived only in this log,
      # which expires, so the calendar showed eleven slots on 2 August as plain "missed" with
      # no way to tell a gate decision from a meeting nobody reached.
      - name: Record why a scheduled meeting was skipped
        if: ${{ github.event_name == 'schedule' && steps.mode.outputs.skip == 'true' && steps.mode.outputs.phase != 'skip' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
          REASON: ${{ steps.mode.outputs.skip_reason }}
        run: |
          pnpm --filter @boardlessai/orchestrator exec tsx src/meetings/skip-cli.ts \
            --phase "$PHASE" --reason "$REASON"
          if test -n "$(git status --porcelain --untracked-files=all -- state/meetings/skips)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/meetings/skips
            git commit -m "skip(${PHASE}): ${REASON}"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash because a failed cycle leaves unrelated unstaged state behind, and
              # a plain rebase refuses to start on a dirty tree — which would drop this commit.
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the record after three attempts." >&2
              exit 1
            fi
          fi

      - name: Pre-cycle release gate
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        run: |
          pnpm agents:validate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Run cycle
        id: run
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
          DRY: ${{ steps.mode.outputs.dry }}
          MEETING_TRIGGER: ${{ github.event_name }}
        run: |
          args=(--phase "$PHASE" --explain-budget --explain-routing)
          if test "$DRY" = "true"; then
            args+=(--dry)
          fi
          set +e
          pnpm cycle -- "${args[@]}"
          cycle_status=$?
          set -e
          if test "$cycle_status" -eq 0; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send the one daily portfolio digest
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.phase == 'night' }}
        env:
          CYCLE_FAILED: ${{ steps.run.outputs.failed }}
          DRY: ${{ steps.mode.outputs.dry }}
        run: |
          args=()
          if test "$DRY" = "true"; then args+=(--dry); fi
          if test "$CYCLE_FAILED" = "true"; then args+=(--final-failed); fi
          pnpm digest:daily -- "${args[@]}"

      - name: Send a one-time hard-limit alert when needed
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' }}
        run: pnpm budget:alert

      # The ledger is the only record of what the providers billed, and it lives in the
      # workspace until something commits it. The atomic cycle commit runs after the release
      # gates and carries no always(), so a run that paid for calls and then failed took its
      # own ledger to the grave with the runner: two runs on 2 August spent about $0.10
      # between them and the month reads as if neither happened. Only spend and the failure
      # notice are committed here, so the atomic cycle commit still owns everything else.
      - name: Record spend from a failed cycle
        # Any failure, not only one the cycle reported. A cycle can exit 0 having billed for
        # calls and then trip the post-cycle gate or the smoke test, and the atomic commit
        # below carries no always() — so the ledger died with the runner either way. The
        # porcelain check makes this a no-op when the atomic commit already took it.
        if: ${{ always() && steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' }}
        run: |
          if test -n "$(git status --porcelain --untracked-files=all -- state/budget state/notify)"; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git add -A -- state/budget state/notify
            git commit -m "ledger(${{ steps.mode.outputs.phase }}): record spend the cycle commit did not take"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then pushed=true; break; fi
              git fetch origin "$GITHUB_REF_NAME"
              # --autostash because a failed cycle leaves unrelated unstaged state behind, and
              # a plain rebase refuses to start on a dirty tree — which would drop this commit.
              git rebase --autostash "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; break; }
            done
            if test "$pushed" != "true"; then
              echo "Could not push the record after three attempts." >&2
              exit 1
            fi
          fi

      - name: Fail closed after recording the final-cycle failure
        if: ${{ steps.mode.outputs.skip != 'true' && steps.run.outputs.failed == 'true' }}
        run: exit 1

      - name: Post-cycle release gate
        if: ${{ steps.mode.outputs.skip != 'true' }}
        run: |
          pnpm agents:validate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check

      - name: Production route and link smoke
        if: ${{ steps.mode.outputs.skip != 'true' }}
        run: |
          pnpm --filter @boardlessai/site start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          pnpm site:smoke

      - name: Commit one atomic runtime cycle
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' && steps.mode.outputs.delivery_only != 'true' }}
        env:
          CYCLE_NUMBER: ${{ github.run_number }}
        run: |
          runtime_paths=(
            config/visual-weights config/ventures.json state/autonomy state/budget state/standups state/meetings
            state/scorecards state/decisions state/calendar state/edition state/ideas state/meeting-agendas state/priority-queue.json
            state/kpis state/money state/mma state/notify state/social state/taste state/ventures state/INBOX.md
            NEEDS_YOUR_HELP_NOW.md
            docs/ECOSYSTEM.md
            site/public/social
          )
          for runtime_path in "${runtime_paths[@]}"; do
            if test -e "$runtime_path" || git ls-files --error-unmatch -- "$runtime_path" > /dev/null 2>&1; then
              git add -A -- "$runtime_path"
            fi
          done
          if git diff --cached --quiet; then
            echo "Cycle produced no canonical state change."
            exit 0
          fi
          git config user.name "boardlessai-cycle[bot]"
          git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
          git commit -m "cycle(${CYCLE_NUMBER})"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              pushed=true
              break
            fi
            echo "Runtime push raced with a newer ${GITHUB_REF_NAME}; refetching before retry ${attempt}."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              break
            fi
          done
          if test "$pushed" != "true"; then
            echo "Runtime state could not be pushed after two refetches. The existing cycle commit was not regenerated."
            exit 1
          fi

      - name: Select the oldest Caught Up delivery
        id: delivery
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.phase == 'cu-edition' && steps.mode.outputs.dry != 'true' }}
        run: pnpm delivery -- next --github-output "$GITHUB_OUTPUT"

      - name: Mint bounded aifirst installation token
        id: delivery-token
        if: ${{ steps.delivery.outputs.has_package == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          owner: lukaskourilcz
          repositories: aifirst

      - name: Deliver package to aifirst main
        id: target
        if: ${{ steps.delivery.outputs.has_package == 'true' }}
        env:
          DELIVERY_TOKEN: ${{ steps.delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.delivery.outputs.package_path }}
          PACKAGE_STATUS: ${{ steps.delivery.outputs.package_status }}
          PACKAGE_DATE: ${{ steps.delivery.outputs.date }}
          PACKAGE_HASH12: ${{ steps.delivery.outputs.hash12 }}
          PACKAGE_SLUG: ${{ steps.delivery.outputs.slug }}
          IMAGE_HERO_PATH: ${{ steps.delivery.outputs.image_hero_path }}
          IMAGE_THUMB_PATH: ${{ steps.delivery.outputs.image_thumb_path }}
        run: |
          clone_root=""
          for attempt in 1 2; do
            candidate="$RUNNER_TEMP/aifirst-delivery-$attempt"
            if git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$candidate"; then
              clone_root="$candidate"
              break
            fi
          done
          if test -z "$clone_root"; then
            echo "GitHub was unreachable after one retry; the package remains in the outbox."
            exit 1
          fi
          pnpm --dir "$clone_root" install --frozen-lockfile
          set +e
          pnpm --dir "$clone_root" consume:edition "$PACKAGE_PATH" "$clone_root" > "$RUNNER_TEMP/delivery-consumer.log" 2>&1
          consumer_status=$?
          set -e
          if test "$consumer_status" -ne 0; then
            cat "$RUNNER_TEMP/delivery-consumer.log"
            if grep -q '\[delivery:hash_conflict\]' "$RUNNER_TEMP/delivery-consumer.log"; then
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=hash_conflict" >> "$GITHUB_OUTPUT"
            elif grep -q '\[delivery:content_invalid\]' "$RUNNER_TEMP/delivery-consumer.log"; then
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            else
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=schema_invalid" >> "$GITHUB_OUTPUT"
            fi
            echo "detail_file=$RUNNER_TEMP/delivery-consumer.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The same gate the MMA path runs before it commits. Caught Up used to check content
          # only, so a change that content-checked but broke the build was pushed, Vercel went
          # red, target-ci resolved to failure and the verifier reverted the fresh commit — the
          # day's edition lost, and the site briefly serving a broken deploy, to learn something
          # a local build would have said first. Captured, because uncaptured under bash -e it
          # aborts before any status= line and both the receipt and fail-closed steps skip.
          set +e
          {
            pnpm --dir "$clone_root" check:content \
              && pnpm --dir "$clone_root" test \
              && pnpm --dir "$clone_root" typecheck \
              && pnpm --dir "$clone_root" build
          } > "$RUNNER_TEMP/delivery-content.log" 2>&1
          content_status=$?
          set -e
          if test "$content_status" -ne 0; then
            tail -40 "$RUNNER_TEMP/delivery-content.log" >&2
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/delivery-content.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          allowed="^public/data/board/${PACKAGE_DATE}\.json$"
          if test "$PACKAGE_STATUS" = "edition"; then
            allowed="^((content/articles/${PACKAGE_DATE}\.(en|cs)\.mdx)|(public/data/board/${PACKAGE_DATE}\.json)|(public/images/editions/${PACKAGE_SLUG}/(hero|thumb)\.(webp|png|svg)))$"
          fi
          unexpected="$(git -C "$clone_root" status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            echo "Consumer touched unauthorized paths:"
            echo "$unexpected"
            exit 1
          fi
          git -C "$clone_root" add \
            "public/data/board/${PACKAGE_DATE}.json"
          if test "$PACKAGE_STATUS" = "edition"; then
            # Czech is the locale that is always written; English is optional and on its way
            # out. git add is fatal on a pathspec that matches nothing, and this step runs
            # under bash -e, so naming the English file unconditionally would abort here —
            # after the consumer had already written everything. status= would stay empty,
            # 'Record the delivery transaction' is gated on it being non-empty and would be
            # skipped, and the edition would be lost for the day with almost no signal.
            git -C "$clone_root" add "content/articles/${PACKAGE_DATE}.cs.mdx" "$IMAGE_HERO_PATH" "$IMAGE_THUMB_PATH"
            if test -f "$clone_root/content/articles/${PACKAGE_DATE}.en.mdx"; then
              git -C "$clone_root" add "content/articles/${PACKAGE_DATE}.en.mdx"
            fi
          fi
          echo "created_commit=false" >> "$GITHUB_OUTPUT"
          if ! git -C "$clone_root" diff --cached --quiet; then
            git -C "$clone_root" config user.name "boardlessai-delivery[bot]"
            git -C "$clone_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
            git -C "$clone_root" commit -m "edition(${PACKAGE_DATE}): ${PACKAGE_SLUG} [package:${PACKAGE_HASH12}]"
            echo "created_commit=true" >> "$GITHUB_OUTPUT"
            pushed=false
            for attempt in 1 2; do
              if git -C "$clone_root" push origin HEAD:main; then
                pushed=true
                break
              fi
              git -C "$clone_root" fetch --depth 1 origin main
              if ! git -C "$clone_root" rebase origin/main; then
                git -C "$clone_root" rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              printf '%s\n' "Target push was rejected after one refetch/retry." > "$RUNNER_TEMP/delivery-push.log"
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=push_rejected" >> "$GITHUB_OUTPUT"
              echo "detail_file=$RUNNER_TEMP/delivery-push.log" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "status=delivered" >> "$GITHUB_OUTPUT"
          echo "target_commit=$(git -C "$clone_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify Caught Up production release
        id: cu-proof
        if: ${{ steps.delivery.outputs.has_package == 'true' && steps.delivery.outputs.package_status == 'edition' && steps.target.outputs.status == 'delivered' }}
        env:
          DELIVERY_TOKEN: ${{ steps.delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.delivery.outputs.hash }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          CREATED_COMMIT: ${{ steps.target.outputs.created_commit }}
        run: |
          proof_status=failed
          for retry in 0 1; do
            set +e
            pnpm release:verify -- \
              --venture caught-up \
              --package "$PACKAGE_PATH" \
              --target-commit "$TARGET_COMMIT" \
              --deployment-url "${CAUGHT_UP_SITE_URL:-https://caughtup-ai.vercel.app}" \
              --github-token "$DELIVERY_TOKEN" \
              --retry-count "$retry" \
              --timeout-ms 300000
            verifier_status=$?
            set -e
            if test "$verifier_status" -eq 0; then
              proof_status=passed
              break
            fi
            if test "$retry" -eq 0; then
              retry_root="$RUNNER_TEMP/aifirst-idempotent-retry"
              git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$retry_root"
              pnpm --dir "$retry_root" install --frozen-lockfile
              pnpm --dir "$retry_root" consume:edition "$PACKAGE_PATH" "$retry_root"
            fi
          done
          revert_commit=""
          if test "$proof_status" != "passed"; then
            if test "$CREATED_COMMIT" = "true"; then
              revert_root="$RUNNER_TEMP/aifirst-release-revert"
              git clone "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/aifirst.git" "$revert_root"
              git -C "$revert_root" config user.name "boardlessai-delivery[bot]"
              git -C "$revert_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
              if git -C "$revert_root" revert --no-edit "$TARGET_COMMIT" && git -C "$revert_root" push origin HEAD:main; then
                revert_commit="$(git -C "$revert_root" rev-parse HEAD)"
              fi
            fi
            fail_args=(fail-closed --venture caught-up --package-hash "$PACKAGE_HASH")
            if test -n "$revert_commit"; then fail_args+=(--revert-commit "$revert_commit"); fi
            pnpm release:verify -- "${fail_args[@]}"
          fi
          echo "status=$proof_status" >> "$GITHUB_OUTPUT"
          echo "revert_commit=$revert_commit" >> "$GITHUB_OUTPUT"

      - name: Record the delivery transaction
        if: ${{ steps.delivery.outputs.has_package == 'true' && steps.target.outputs.status != '' }}
        env:
          DELIVERY_STATUS: ${{ steps.target.outputs.status }}
          FAILURE_CODE: ${{ steps.target.outputs.failure_code }}
          DETAIL_FILE: ${{ steps.target.outputs.detail_file }}
          PACKAGE_STATE_PATH: ${{ steps.delivery.outputs.package_state_path }}
          TARGET_COMMIT: ${{ steps.target.outputs.target_commit }}
          PACKAGE_DATE: ${{ steps.delivery.outputs.date }}
          PACKAGE_HASH12: ${{ steps.delivery.outputs.hash12 }}
          PROOF_STATUS: ${{ steps.cu-proof.outputs.status }}
        run: |
          if test "$PROOF_STATUS" = "failed"; then
            DELIVERY_STATUS=needs_reconciliation
            FAILURE_CODE=post_deploy_verification
          fi
          args=(record --package "$PACKAGE_STATE_PATH" --status "$DELIVERY_STATUS")
          if test -n "$FAILURE_CODE"; then args+=(--code "$FAILURE_CODE"); fi
          if test -n "$DETAIL_FILE"; then args+=(--detail-file "$DETAIL_FILE"); fi
          if test -n "$TARGET_COMMIT"; then args+=(--target-commit "$TARGET_COMMIT"); fi
          pnpm delivery -- "${args[@]}"
          receipt_paths=(state/edition state/meetings state/release-proofs state/notify state/ventures/caught-up state/INBOX.md)
          for receipt_path in "${receipt_paths[@]}"; do
            if test -e "$receipt_path" || git ls-files --error-unmatch -- "$receipt_path" > /dev/null 2>&1; then
              git add -A -- "$receipt_path"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git commit -m "delivery(${PACKAGE_DATE}): ${DELIVERY_STATUS} [package:${PACKAGE_HASH12}]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              echo "Delivery receipt push raced with a newer ${GITHUB_REF_NAME}; refetching before retry ${attempt}."
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              echo "Delivery receipt could not be pushed after two refetches."
              exit 1
            fi
          fi

      - name: Fail closed on delivery reconciliation
        if: ${{ steps.target.outputs.status == 'needs_reconciliation' || steps.cu-proof.outputs.status == 'failed' }}
        run: exit 1

      - name: Select pending MMA Files delivery
        id: mma-delivery
        if: ${{ steps.mode.outputs.skip != 'true' && steps.mode.outputs.dry != 'true' && vars.MMA_FILES_LIVE_ENABLED == 'true' && (steps.mode.outputs.phase == 'mma-intake' || steps.mode.outputs.phase == 'mma-analysis' || steps.mode.outputs.phase == 'article-am' || steps.mode.outputs.phase == 'article-pm' || steps.mode.outputs.phase == 'mag-desk') }}
        env:
          PHASE: ${{ steps.mode.outputs.phase }}
        run: |
          package_kind=article
          if test "$PHASE" = "mma-intake" || test "$PHASE" = "mma-analysis"; then
            package_kind=fightaiq
          fi
          pnpm mma:delivery -- next --kind "$package_kind" --github-output "$GITHUB_OUTPUT"

      - name: Mint bounded MMA Files installation token
        id: mma-delivery-token
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ secrets.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          owner: lukaskourilcz
          repositories: mma-files

      - name: Deliver package to MMA Files main
        id: mma-target
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' }}
        env:
          DELIVERY_TOKEN: ${{ steps.mma-delivery-token.outputs.token }}
          PACKAGE_KIND: ${{ steps.mma-delivery.outputs.package_kind }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH12: ${{ steps.mma-delivery.outputs.package_hash12 }}
          PACKAGE_LABEL: ${{ steps.mma-delivery.outputs.package_label }}
          PACKAGE_SLUG: ${{ steps.mma-delivery.outputs.package_slug }}
          IMAGE_HERO_PATH: ${{ steps.mma-delivery.outputs.image_hero_path }}
          IMAGE_THUMB_PATH: ${{ steps.mma-delivery.outputs.image_thumb_path }}
        run: |
          clone_root=""
          for attempt in 1 2; do
            candidate="$RUNNER_TEMP/mma-files-delivery-$attempt"
            if git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$candidate"; then
              clone_root="$candidate"
              break
            fi
          done
          if test -z "$clone_root"; then
            printf '%s\n' "GitHub was unreachable after one retry." > "$RUNNER_TEMP/mma-delivery-error.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=unreachable" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm --prefix "$clone_root" ci
          set +e
          npm --prefix "$clone_root" run consume:boardless -- "$PACKAGE_PATH" "$clone_root" > "$RUNNER_TEMP/mma-consumer.log" 2>&1
          consumer_status=$?
          set -e
          if test "$consumer_status" -ne 0; then
            cat "$RUNNER_TEMP/mma-consumer.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            if grep -q '\[delivery:hash_conflict\]' "$RUNNER_TEMP/mma-consumer.log"; then
              echo "failure_code=hash_conflict" >> "$GITHUB_OUTPUT"
            elif grep -q '\[delivery:content_invalid\]' "$RUNNER_TEMP/mma-consumer.log"; then
              echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            else
              echo "failure_code=schema_invalid" >> "$GITHUB_OUTPUT"
            fi
            echo "detail_file=$RUNNER_TEMP/mma-consumer.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          allowed="^((data/boardless/articles\.json)|(public/images/articles/${PACKAGE_SLUG}/(hero|thumb)\.(webp|png|svg)))$"
          if test "$PACKAGE_KIND" = "fightaiq"; then
            allowed='^data/boardless/fightaiq\.json$'
          fi
          unexpected="$(git -C "$clone_root" status --porcelain --untracked-files=all | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if test -n "$unexpected"; then
            printf '%s\n%s\n' "Consumer touched unauthorized paths:" "$unexpected" > "$RUNNER_TEMP/mma-delivery-error.log"
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=content_invalid" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The target repository's own gates, captured like every other failure in this step.
          # Uncaptured they abort before any status= line is written, so the receipt step and
          # the fail-closed step both silently skip and the incident leaves no durable record.
          set +e
          {
            npm --prefix "$clone_root" run test \
              && npm --prefix "$clone_root" run typecheck \
              && NEXT_PUBLIC_SITE_URL=https://mma-files.vercel.app NEXT_PUBLIC_DEMO_MODE=false npm --prefix "$clone_root" run build
          } > "$RUNNER_TEMP/mma-target-gate.log" 2>&1
          gate_status=$?
          set -e
          if test "$gate_status" -ne 0; then
            tail -40 "$RUNNER_TEMP/mma-target-gate.log" >&2
            echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
            echo "failure_code=target_gate_failed" >> "$GITHUB_OUTPUT"
            echo "detail_file=$RUNNER_TEMP/mma-target-gate.log" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test "$PACKAGE_KIND" = "article"; then
            git -C "$clone_root" add data/boardless/articles.json "$IMAGE_HERO_PATH" "$IMAGE_THUMB_PATH"
          else
            git -C "$clone_root" add data/boardless/fightaiq.json
          fi
          echo "created_commit=false" >> "$GITHUB_OUTPUT"
          if ! git -C "$clone_root" diff --cached --quiet; then
            git -C "$clone_root" config user.name "boardlessai-delivery[bot]"
            git -C "$clone_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
            git -C "$clone_root" commit -m "delivery(${PACKAGE_KIND}): ${PACKAGE_LABEL} [package:${PACKAGE_HASH12}]"
            echo "created_commit=true" >> "$GITHUB_OUTPUT"
            pushed=false
            for attempt in 1 2; do
              if git -C "$clone_root" push origin HEAD:main; then
                pushed=true
                break
              fi
              git -C "$clone_root" fetch --depth 1 origin main
              if ! git -C "$clone_root" rebase origin/main; then
                git -C "$clone_root" rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              printf '%s\n' "Target push was rejected after one refetch/retry." > "$RUNNER_TEMP/mma-delivery-error.log"
              echo "status=needs_reconciliation" >> "$GITHUB_OUTPUT"
              echo "failure_code=push_rejected" >> "$GITHUB_OUTPUT"
              echo "detail_file=$RUNNER_TEMP/mma-delivery-error.log" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "status=delivered" >> "$GITHUB_OUTPUT"
          echo "target_commit=$(git -C "$clone_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify MMA Files production article
        id: mma-proof
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' && steps.mma-delivery.outputs.package_kind == 'article' && steps.mma-target.outputs.status == 'delivered' }}
        env:
          DELIVERY_TOKEN: ${{ steps.mma-delivery-token.outputs.token }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.mma-delivery.outputs.package_hash }}
          TARGET_COMMIT: ${{ steps.mma-target.outputs.target_commit }}
          CREATED_COMMIT: ${{ steps.mma-target.outputs.created_commit }}
        run: |
          proof_status=failed
          for retry in 0 1; do
            set +e
            pnpm release:verify -- \
              --venture mma-files \
              --package "$PACKAGE_PATH" \
              --target-commit "$TARGET_COMMIT" \
              --deployment-url "${MMA_FILES_SITE_URL:-https://mma-files.vercel.app}" \
              --github-token "$DELIVERY_TOKEN" \
              --retry-count "$retry" \
              --timeout-ms 300000
            verifier_status=$?
            set -e
            if test "$verifier_status" -eq 0; then
              proof_status=passed
              break
            fi
            if test "$retry" -eq 0; then
              retry_root="$RUNNER_TEMP/mma-files-idempotent-retry"
              git clone --depth 1 "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$retry_root"
              npm --prefix "$retry_root" ci
              npm --prefix "$retry_root" run consume:boardless -- "$PACKAGE_PATH" "$retry_root"
            fi
          done
          revert_commit=""
          if test "$proof_status" != "passed"; then
            if test "$CREATED_COMMIT" = "true"; then
              revert_root="$RUNNER_TEMP/mma-files-release-revert"
              git clone "https://x-access-token:${DELIVERY_TOKEN}@github.com/lukaskourilcz/mma-files.git" "$revert_root"
              git -C "$revert_root" config user.name "boardlessai-delivery[bot]"
              git -C "$revert_root" config user.email "boardlessai-delivery[bot]@users.noreply.github.com"
              if git -C "$revert_root" revert --no-edit "$TARGET_COMMIT" && git -C "$revert_root" push origin HEAD:main; then
                revert_commit="$(git -C "$revert_root" rev-parse HEAD)"
              fi
            fi
            fail_args=(fail-closed --venture mma-files --package-hash "$PACKAGE_HASH")
            if test -n "$revert_commit"; then fail_args+=(--revert-commit "$revert_commit"); fi
            pnpm release:verify -- "${fail_args[@]}"
          fi
          echo "status=$proof_status" >> "$GITHUB_OUTPUT"
          echo "revert_commit=$revert_commit" >> "$GITHUB_OUTPUT"

      - name: Record MMA Files delivery transaction
        if: ${{ steps.mma-delivery.outputs.has_package == 'true' && steps.mma-target.outputs.status != '' }}
        env:
          DELIVERY_STATUS: ${{ steps.mma-target.outputs.status }}
          FAILURE_CODE: ${{ steps.mma-target.outputs.failure_code }}
          DETAIL_FILE: ${{ steps.mma-target.outputs.detail_file }}
          PACKAGE_KIND: ${{ steps.mma-delivery.outputs.package_kind }}
          PACKAGE_PATH: ${{ steps.mma-delivery.outputs.package_path }}
          PACKAGE_HASH: ${{ steps.mma-delivery.outputs.package_hash }}
          PACKAGE_HASH12: ${{ steps.mma-delivery.outputs.package_hash12 }}
          TARGET_COMMIT: ${{ steps.mma-target.outputs.target_commit }}
          PROOF_STATUS: ${{ steps.mma-proof.outputs.status }}
        run: |
          if test "$PROOF_STATUS" = "failed"; then
            DELIVERY_STATUS=needs_reconciliation
            FAILURE_CODE=post_deploy_verification
          fi
          args=(record --kind "$PACKAGE_KIND" --package "$PACKAGE_PATH" --hash "$PACKAGE_HASH" --status "$DELIVERY_STATUS")
          if test -n "$FAILURE_CODE"; then args+=(--code "$FAILURE_CODE"); fi
          if test -n "$DETAIL_FILE"; then args+=(--detail-file "$DETAIL_FILE"); fi
          if test -n "$TARGET_COMMIT"; then args+=(--target-commit "$TARGET_COMMIT"); fi
          pnpm mma:delivery -- "${args[@]}"
          receipt_paths=(state/ventures/mma-files/deliveries state/ventures/fightaiq/deliveries state/release-proofs state/notify state/ventures/mma-files/PAUSED state/INBOX.md)
          for receipt_path in "${receipt_paths[@]}"; do
            if test -e "$receipt_path" || git ls-files --error-unmatch -- "$receipt_path" > /dev/null 2>&1; then
              git add -A -- "$receipt_path"
            fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "boardlessai-cycle[bot]"
            git config user.email "boardlessai-cycle[bot]@users.noreply.github.com"
            git commit -m "delivery(mma-files): ${DELIVERY_STATUS} [package:${PACKAGE_HASH12}]"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                break
              fi
            done
            if test "$pushed" != "true"; then
              echo "MMA Files delivery receipt could not be pushed after two refetches."
              exit 1
            fi
          fi

      - name: Fail closed on MMA Files delivery reconciliation
        if: ${{ steps.mma-target.outputs.status == 'needs_reconciliation' || steps.mma-proof.outputs.status == 'failed' }}
        run: exit 1
