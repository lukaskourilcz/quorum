name: Guarded social publisher

on:
  # Paused, not deleted. Every channel is off behind the social triple-lock, so twenty-four
  # firings a day existed to confirm there was nothing to publish. Uncomment the schedule when
  # a channel is enabled; workflow_dispatch still runs it on demand in the meantime.
  # schedule:
  #   - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate due queue items without external publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate or publish approved queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOCIAL_KILL_SWITCH: ${{ vars.SOCIAL_KILL_SWITCH }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      CAUGHT_UP_THREADS_USER_ID: ${{ vars.CAUGHT_UP_THREADS_USER_ID }}
      CAUGHT_UP_THREADS_ACCESS_TOKEN: ${{ secrets.CAUGHT_UP_THREADS_ACCESS_TOKEN }}
      CAUGHT_UP_INSTAGRAM_USER_ID: ${{ vars.CAUGHT_UP_INSTAGRAM_USER_ID }}
      CAUGHT_UP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CAUGHT_UP_INSTAGRAM_ACCESS_TOKEN }}
      MMA_FILES_THREADS_USER_ID: ${{ vars.MMA_FILES_THREADS_USER_ID }}
      MMA_FILES_THREADS_ACCESS_TOKEN: ${{ secrets.MMA_FILES_THREADS_ACCESS_TOKEN }}
      MMA_FILES_INSTAGRAM_USER_ID: ${{ vars.MMA_FILES_INSTAGRAM_USER_ID }}
      MMA_FILES_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.MMA_FILES_INSTAGRAM_ACCESS_TOKEN }}
      TITTY_TUESDAYS_THREADS_USER_ID: ${{ vars.TITTY_TUESDAYS_THREADS_USER_ID }}
      TITTY_TUESDAYS_THREADS_ACCESS_TOKEN: ${{ secrets.TITTY_TUESDAYS_THREADS_ACCESS_TOKEN }}
      TITTY_TUESDAYS_INSTAGRAM_USER_ID: ${{ vars.TITTY_TUESDAYS_INSTAGRAM_USER_ID }}
      TITTY_TUESDAYS_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.TITTY_TUESDAYS_INSTAGRAM_ACCESS_TOKEN }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Honor repository pause
        run: |
          if test -e state/PAUSED; then
            echo "A repository-wide pause is present; refusing to run."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-publish checks
        run: |
          pnpm --filter @boardlessai/orchestrator typecheck
          pnpm --filter @boardlessai/orchestrator test

      - name: Run two-phase publisher
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          args=(--dry-if-disabled)
          if test "$EVENT_NAME" = "workflow_dispatch" && test "$VALIDATE_ONLY" = "true"; then
            args+=(--validate-only)
          fi
          pnpm social:publish -- "${args[@]}"

      - name: Validate publisher state
        run: |
          pnpm --filter @boardlessai/orchestrator test
          git diff --check

      - name: Commit immutable queue state and receipts
        run: |
          git add state/social state/notify NEEDS_YOUR_HELP_NOW.md
          if git diff --cached --quiet; then
            echo "Publisher produced no state change."
            exit 0
          fi
          git config user.name "boardlessai-social[bot]"
          git config user.email "boardlessai-social[bot]@users.noreply.github.com"
          git commit -m "social(${GITHUB_RUN_NUMBER})"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "Social state could not be pushed after three rebase-first attempts."
          exit 1
