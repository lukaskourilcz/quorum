name: Guarded social publisher

on:
  # Paused, not deleted. Every channel is off behind the social triple-lock, so twenty-four
  # firings a day existed to confirm there was nothing to publish — each one paying about 4.3
  # billable minutes of checkout and install to reach that answer, roughly 1,600 minutes a month.
  #
  # When a channel is enabled, restore the schedule AND keep the job-level `if:` below. The
  # guard has to sit on the job, not inside a step: a locked hour that reaches the runner has
  # already been billed a whole minute, while a job whose `if:` is false costs nothing at all.
  # schedule:
  #   - cron: "55 * * * *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate due queue items without external publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate or publish approved queue
    # A scheduled firing with the kill switch on never starts a runner. A dispatch always runs:
    # the owner started it by hand or approved a post in the Admin Queue (#574), and wants the
    # run's answer either way. The Queue's dispatch is a wake-up; this run decides what sends.
    if: ${{ github.event_name != 'schedule' || vars.SOCIAL_KILL_SWITCH != 'true' }}
    runs-on: ubuntu-latest
    # Two orchestrator suites, the claim push, Direct Meta's container waits and Buffer's read-back
    # (up to about three and a half minutes when LinkedIn is slow) leave fifteen minutes no margin.
    # A timeout during the send cancels the steps that commit its receipts; the pushed claim still
    # keeps the item from being sent again, but the owner then has to reconcile it by hand.
    timeout-minutes: 20
    env:
      SOCIAL_KILL_SWITCH: ${{ vars.SOCIAL_KILL_SWITCH }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
      CAUGHT_UP_THREADS_USER_ID: ${{ vars.CAUGHT_UP_THREADS_USER_ID }}
      CAUGHT_UP_THREADS_ACCESS_TOKEN: ${{ secrets.CAUGHT_UP_THREADS_ACCESS_TOKEN }}
      CAUGHT_UP_INSTAGRAM_USER_ID: ${{ vars.CAUGHT_UP_INSTAGRAM_USER_ID }}
      CAUGHT_UP_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CAUGHT_UP_INSTAGRAM_ACCESS_TOKEN }}
      # MMA Files and Titty Tuesdays are paused (operations-2026-09b), so their Threads and
      # Instagram credentials no longer reach this job. Resuming either restores its four lines.
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
      # Where Instagram and Threads fetch frames from (quorum#570). Unset means jsdelivr: the URL is
      # pinned to the commit that carries the frame, which this job's full-history checkout names.
      SOCIAL_ASSET_BASE: ${{ vars.SOCIAL_ASSET_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as it stands when this run starts, not the commit the dispatch named. Two
          # approvals a minute apart queue two runs; the second waits for the first and must see
          # the post the first one published, or it would find it still queued and send it again.
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Honor repository pause
        run: |
          if test -e state/PAUSED; then
            echo "A repository-wide pause is present; refusing to run."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-publish checks
        run: |
          pnpm --filter @boardlessai/orchestrator typecheck
          pnpm --filter @boardlessai/orchestrator test

      # The run is two phases with a push between them (quorum#574 review). The claim phase marks
      # each item it will send `publishing` and contacts no provider; the claims reach the branch
      # before the send starts. The Queue replaces an item only against the version it read, so an
      # owner's hold, edit or reject that lands first makes the claim push conflict and nothing is
      # sent, and one that lands after it finds `publishing` and is refused.
      - name: Claim due posts
        id: claim
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          claims_file="$RUNNER_TEMP/social-claims.json"
          args=(--dry-if-disabled --phase claim --claims-file "$claims_file")
          if test "$EVENT_NAME" = "workflow_dispatch" && test "$VALIDATE_ONLY" = "true"; then
            args+=(--validate-only)
          fi
          pnpm social:publish -- "${args[@]}"
          if test -s "$claims_file"; then
            echo "claimed=true" >> "$GITHUB_OUTPUT"
          else
            echo "claimed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the claims before anything is sent
        id: push-claims
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git config user.name "boardlessai-social[bot]"
          git config user.email "boardlessai-social[bot]@users.noreply.github.com"
          git add state/social/queue
          git commit -m "social(${GITHUB_RUN_NUMBER}): claim"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # A conflict here means a claimed item changed on the branch since checkout, most likely
            # the owner's hold or edit. That change wins: stop before any send.
            if ! git rebase --autostash "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "::error title=Claim refused::A claimed queue item changed on ${GITHUB_REF_NAME} since checkout; nothing was sent."
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "::error title=Claim not pushed::The claims could not be pushed after three rebase-first attempts; nothing was sent."
          exit 1

      - name: Send the claimed posts
        id: send
        if: steps.claim.outputs.claimed == 'true'
        run: |
          # The exit code is recorded, not raised here: whatever happened, the next two steps
          # validate and commit the receipts, statuses and pauses this run wrote, and the last step
          # fails the job afterwards. A send that exits 2 still has state that must reach the branch.
          status=0
          pnpm social:publish -- --phase send --claims-file "$RUNNER_TEMP/social-claims.json" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      # From here on every step runs after a failed send too. It is skipped only when the claim
      # itself failed or its push was refused: then nothing was sent and the local claims must not
      # reach the branch.
      - name: Validate publisher state
        if: ${{ !cancelled() && steps.claim.outcome == 'success' && steps.push-claims.outcome != 'failure' }}
        run: |
          pnpm --filter @boardlessai/orchestrator test
          git diff --check

      - name: Commit immutable queue state and receipts
        if: ${{ !cancelled() && steps.claim.outcome == 'success' && steps.push-claims.outcome != 'failure' }}
        run: |
          git add state/social state/notify docs/NEEDED.md
          if git diff --cached --quiet; then
            echo "Publisher produced no state change."
            exit 0
          fi
          git config user.name "boardlessai-social[bot]"
          git config user.email "boardlessai-social[bot]@users.noreply.github.com"
          git commit -m "social(${GITHUB_RUN_NUMBER})"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            # -X theirs keeps this run's side of a conflicting hunk: in a rebase "theirs" is the
            # commit being replayed. A receipt of a post that is live must never be dropped for a
            # queue file someone else touched in between.
            if ! git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              continue
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "::error title=Receipts not pushed::Social state could not be pushed after three rebase-first attempts."
          exit 1

      - name: Fail when a post needs the owner
        if: ${{ !cancelled() && steps.send.outputs.exit_code != '' && steps.send.outputs.exit_code != '0' }}
        env:
          SEND_EXIT_CODE: ${{ steps.send.outputs.exit_code }}
        run: |
          echo "::error title=Publisher needs the owner::A post was refused or its outcome is ambiguous (exit $SEND_EXIT_CODE). Its state is committed; see the Queue and state/social/posts."
          exit "$SEND_EXIT_CODE"
