packages:
  - orchestrator
  - site
  - studio

allowBuilds:
  esbuild: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  "bare-events@>=2.9.2": 2.9.1
  "brace-expansion@<1.1.18": 1.1.18
  brace-expansion@1.1.16: 1.1.17
  brace-expansion@5.0.7: 5.0.9
  "js-yaml@<4.3.2": 4.3.2
  "nanoid@<3.3.18": 3.3.18
  "postcss@<8.5.18": 8.5.25
  "sharp@<0.35.0": 0.35.4
  "smol-toml@<1.7.1": 1.7.1
  "undici@>=5 <6": 5.29.0
  "undici@>=6 <7": 6.28.0
  "tar@>=7 <7.5.18": 7.5.18
  "minimatch@>=10 <10.2.3": 10.2.3
  "@tootallnate/once@<2.0.1": 2.0.1

# Releases build on a Mac and upload a prebuilt output to Vercel's Linux arm64
# functions, so native packages (resvg, sharp) need their linux-arm64-gnu builds
# installed next to the host's. Without them the function cannot load resvg.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
